name: QA (Docker)

# The Docker QA stack (qa/): dm built from the pull request, against servers
# that misbehave on request, on a network with no way out. See BUGLOG.md.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run the suite
        run: sh qa/run.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-reports
          path: qa/reports/
