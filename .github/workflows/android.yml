name: Android, the engine built

# dm on Android, all in Rust (gaps rows N1, N2, N14, N16): desktop/crates/dm-android is the
# desktop's engine and its rules (dm-core, dm-net, dm-media, dm-torrent, dm-shell) under a GPUI
# window on gpui-android (desktop/vendor/gpui-android, dm's copy of gpui-mobile's Android
# platform), with the phone's services through JNI. This keeps it building for the phone's two
# kinds of processor, the ARM of phones (arm64-v8a) and the x86_64 of the emulator, with the
# Android NDK the runner already carries, so a desktop change that breaks Android is seen
# before it lands; runs dm-android's own tests on the runner itself; and packages the APK for
# the emulator: libdm_android.so built by cargo-ndk, then the small Gradle project in
# desktop/crates/dm-android/android (gpui-mobile's two Java classes, no Kotlin), kept as
# the run's artifact (docs/android.md).
on:
  push:
    branches: [main]
  pull_request:
    paths: ['desktop/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: desktop

env:
  CARGO_TERM_COLOR: always
  # File and line in a panic's backtrace, without the rest of the debug info: faster builds
  # and links, a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  android:
    name: Android (arm64-v8a, x86_64, the APK)
    runs-on: ubuntu-latest
    # A hang is a failure, not hours of waiting.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-ndk
      # The runner's own NDK (ubuntu-latest carries the newest as ANDROID_NDK_LATEST_HOME), so
      # no action of anyone else's downloads one; cargo-ndk finds it through ANDROID_NDK_HOME.
      # ring and the network-interface listing build their C with its clang.
      - name: The runner's NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # Android 8.0 (API 26) and up, as decided in N1 (docs/decisions.md, 2026-11-20).
      - name: Check for the phone and the emulator
        run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 check -p dm-android --locked
      - name: dm-android's tests, on the runner
        run: cargo test -p dm-android --locked
      # The APK (row N14). First the library, for the emulator (x86_64), put where Gradle packs
      # it (app/src/main/jniLibs/x86_64/libdm_android.so).
      - name: libdm_android.so, for the emulator (x86_64)
        run: cargo ndk --platform 26 -t x86_64 -o crates/dm-android/android/app/src/main/jniLibs build -p dm-android --lib --release --locked
      # Android 15's platform (compileSdk 35) and its build tools, from the runner's own SDK.
      - name: Android 15's platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # Gradle itself, checked against the SHA-256 Gradle publishes, so no action of anyone
      # else's runs; the runner's JDK 17 runs it (the Android Gradle plugin 8.7 needs 17).
      - name: Gradle 8.14.3
        env:
          GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          curl -sSfL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      # A debug APK, signed with the debug key Gradle makes for the run: an APK to install on an
      # emulator or a test phone, not a release (a release is signed with dm's own key, N14).
      - name: The APK, for the emulator (x86_64)
        working-directory: desktop/crates/dm-android/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dm-android-x86_64-apk
          path: desktop/crates/dm-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
