name: Android, the engine built

# EDM on Android, all in Rust (gaps rows N1, N2, N14, N16): crates/edm-android is the
# desktop's engine and its rules (edm-core, edm-net, edm-media, edm-torrent, edm-shell) under a GPUI
# window on gpui-android (vendor/gpui-android, EDM's copy of gpui-mobile's Android
# platform), with the phone's services through JNI. This keeps it building for the phone's two
# kinds of processor, the ARM of phones (arm64-v8a) and the x86_64 of the emulator, with the
# Android NDK the runner already carries, so a desktop change that breaks Android is seen
# before it lands; runs edm-android's own tests on the runner itself; and packages the APK for
# the emulator: libedm_android.so built by cargo-ndk, then the small Gradle project in
# crates/edm-android/android (gpui-mobile's two Java classes, no Kotlin), kept as
# the run's artifact (docs/android.md). The emulator job then runs that APK on Android 10
# (API 29) and Android 15 (API 35): started, its window drawn, a link shared to it downloaded
# (row N13, scripts/android-emulator-check.sh). At a tag `android-v<version>` the release job
# builds the release APK for all three processors, signs it with EDM's key when the
# repository has one, and attaches it to a draft release (row N14). Not `v*`, the
# extension's tags (release.yml), nor `desktop-v*`, the desktop's (desktop.yml): each has its
# own version.
on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
    paths: ["crates/**", "tooling/**", "assets/**", "vendor/**", "packaging/**", "Cargo.toml", "Cargo.lock", ".cargo/**", 'scripts/android-emulator-check.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in a panic's backtrace, without the rest of the debug info: faster builds
  # and links, a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  android:
    name: Android (arm64-v8a, x86_64, the APK)
    runs-on: ubuntu-latest
    # A hang is a failure, not hours of waiting.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk
      # The runner's own NDK (ubuntu-latest carries the newest as ANDROID_NDK_LATEST_HOME), so
      # no action of anyone else's downloads one; cargo-ndk finds it through ANDROID_NDK_HOME.
      # ring and the network-interface listing build their C with its clang.
      - name: The runner's NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "EDM_NDK_VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_LATEST_HOME/source.properties")" >> "$GITHUB_ENV"
      # Android 10 (API 29) and up (the maintainer, 2026-11-22; docs/decisions.md).
      - name: Check for the phone and the emulator
        run: cargo ndk --platform 29 -t arm64-v8a -t x86_64 check -p edm-android --locked
      # Clippy for the phone, warnings as errors (row N17). One lint allowed on Android alone:
      # `missing_const_for_thread_local` flags every `const { }` thread-local there, as std's
      # Android thread-locals (no `target_thread_local`) wrap the initialiser in a plain fn.
      - name: Clippy for the phone
        run: cargo ndk --platform 29 -t arm64-v8a clippy -p edm-android --locked -- -D warnings -A clippy::missing_const_for_thread_local
      - name: edm-android's tests, on the runner
        run: cargo test -p edm-android --locked
      # The APK (row N14). First the library, for the emulator (x86_64), put where Gradle packs
      # it (app/src/main/jniLibs/x86_64/libedm_android.so).
      - name: libedm_android.so, for the emulator (x86_64)
        run: cargo ndk --platform 29 -t x86_64 -o crates/edm-android/android/app/src/main/jniLibs build -p edm-android --lib --release --locked
      # Android 15's platform (compileSdk 35) and its build tools, from the runner's own SDK.
      - name: Android 15's platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # Gradle itself, checked against the SHA-256 Gradle publishes, so no action of anyone
      # else's runs; the runner's JDK 17 runs it (the Android Gradle plugin 8.7 needs 17). Named
      # by the image's JAVA_HOME_17_X64, as its default JDK moved on (25 from 2026-11-21, which
      # Gradle 8.14 cannot run on: the build stopped saying only "25.0.5").
      - name: Gradle 8.14.3
        env:
          GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          curl -sSfL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      # A debug APK, signed with the debug key Gradle makes for the run: an APK to install on an
      # emulator or a test phone, not a release (a release is signed with EDM's own key, N14).
      # edm.skipCargo: the library is built above, so Gradle's own cargoNdk task (Android
      # Studio's) is skipped; edm.ndkVersion: Gradle strips with the NDK cargo-ndk used.
      - name: The APK, for the emulator (x86_64)
        working-directory: crates/edm-android/android
        run: gradle --no-daemon assembleDebug -Pdm.skipCargo=true "-Pdm.ndkVersion=$EDM_NDK_VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: edm-android-x86_64-apk
          path: crates/edm-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The debug APK on the emulator (row N13): Android 10, the oldest EDM takes, and Android 15,
  # the one it is built against. The runner's own SDK tools and Google's system images,
  # fetched by sdkmanager (which checks each package's digest), so no action of anyone else's
  # starts the emulator; KVM is opened to the runner's user as GitHub's runners allow.
  emulator:
    name: On the emulator (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
        include:
          # Android 10's emulator image has no guest Vulkan, and its OpenGL ES 3.0 no storage
          # buffers, which GPUI's renderer needs: its window is not looked at (a phone with
          # Vulkan or OpenGL ES 3.1 draws it). Android 15's is.
          - api: 29
            no_gpu: 1
    env:
      IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
      EDM_NO_GPU: ${{ matrix.no_gpu || 0 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: edm-android-x86_64-apk
          path: ${{ runner.temp }}/apk
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The trigger is asynchronous: the node's mode changes only once udev has run.
          sudo udevadm settle --timeout=30 || true
          ls -l /dev/kvm || { echo "::error::this runner has no /dev/kvm"; grep -cE 'vmx|svm' /proc/cpuinfo || true; exit 1; }
          test -w /dev/kvm || sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - name: The emulator and Android ${{ matrix.api }}'s system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      # A phone-sized screen (1080 x 2340 at 420 dpi), no window on the runner, the GPU in
      # software (SwiftShader: OpenGL ES 3, and Vulkan on the newer images).
      - name: An emulated phone, booted
        run: |
          # Where the emulated phone is kept, for avdmanager and the emulator this step starts:
          # the runner's own setting put it outside ~/.android/avd, where this looked.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n EDM -k "$IMAGE" --force
          printf 'hw.ram=3072\nhw.lcd.density=420\nhw.lcd.width=1080\nhw.lcd.height=2340\n' >> "$ANDROID_AVD_HOME/EDM.avd/config.ini"
          nohup emulator -avd EDM -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          # The inner shell expands it, on each pass of its loop: single quotes on purpose.
          # shellcheck disable=SC2016
          timeout 600 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: EDM started, drawn, a shared link downloaded
        run: bash scripts/android-emulator-check.sh "$RUNNER_TEMP/apk/app-debug.apk" "$RUNNER_TEMP/seen"
      - name: The emulator's own log, beside what EDM left
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/seen"
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/seen/" 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: edm-android-emulator-api${{ matrix.api }}
          path: ${{ runner.temp }}/seen
          if-no-files-found: warn
      - name: The emulator stopped
        if: always()
        run: adb emu kill || true

  # The release APK at a tag `android-v<version>` (row N14): one APK for the ARM of phones
  # (arm64-v8a), older 32-bit ones (armeabi-v7a) and the x86_64 of emulators and Chromebooks,
  # built only after the checks, the tests and the emulator passed. Signed with EDM's own key
  # from the repository's secrets; without them it goes out unsigned, named so and said in a
  # notice, as R1's unsigned desktop builds are. A draft, looked at before anybody downloads
  # it, and never "latest": the desktop updater reads the latest release. Google Play needs a
  # fee and stays BLOCKED (gaps R4); F-Droid builds from source (docs/android.md).
  release:
    name: The release APK, at a tag
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [android, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      # Build attestations (gaps row H29).
      id-token: write
      attestations: write
    env:
      EDM_ANDROID_KEYSTORE: ${{ secrets.EDM_ANDROID_KEYSTORE }}
      EDM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EDM_ANDROID_KEYSTORE_PASSWORD }}
      EDM_ANDROID_KEY_ALIAS: ${{ secrets.EDM_ANDROID_KEY_ALIAS }}
      EDM_ANDROID_KEY_PASSWORD: ${{ secrets.EDM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk
      # The NDK's version is printed: a rebuild that is to match this one uses the same.
      - name: The runner's NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"
          echo "EDM_NDK_VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_LATEST_HOME/source.properties")" >> "$GITHUB_ENV"
      # The tag names the version the phone shows: the crate's and Gradle's versionName agree.
      - name: Check the tag matches the crate and the APK
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/edm-android/Cargo.toml | head -1)
          gradle=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' crates/edm-android/android/app/build.gradle.kts | head -1)
          if [ "$tag" != "$crate" ] || [ "$tag" != "$gradle" ]; then
            echo "::error::tag android-v$tag does not match edm-android's Cargo.toml ($crate) and app/build.gradle.kts ($gradle)"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      # A phone takes an update only with a higher versionCode (0.10.1 once shipped with the
      # last one's, row N32): above the previous android-v tag's, or the release stops here.
      - name: Check versionCode is above the last release's
        run: |
          git fetch --quiet --depth=1 origin '+refs/tags/android-v*:refs/tags/android-v*'
          code() { sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' | head -1; }
          now=$(code < crates/edm-android/android/app/build.gradle.kts)
          last=$(git tag --list 'android-v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          if [ -z "$last" ]; then echo "no earlier release"; exit 0; fi
          before=$(git show "${last}:crates/edm-android/android/app/build.gradle.kts" | code)
          echo "versionCode $now; $last had $before"
          if [ -z "$now" ] || [ -z "$before" ] || [ "$now" -le "$before" ]; then
            echo "::error::versionCode $now is not above $last's ($before): raise it in app/build.gradle.kts"
            exit 1
          fi
      # The checkout's and cargo's folders named alike on every computer, so the library does
      # not depend on where it was built (docs/android.md, "F-Droid").
      - name: libedm_android.so, for the three processors
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/EDM --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo ndk --platform 29 -t arm64-v8a -t armeabi-v7a -t x86_64 -o crates/edm-android/android/app/src/main/jniLibs build -p edm-android --lib --release --locked
      # Each library with the system's protections, read from its headers (gaps row H13).
      - name: The libraries' protections
        run: cargo xtask hardening-check crates/edm-android/android/app/src/main/jniLibs/*/libedm_android.so
      - name: Android 15's platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      # JDK 17 by name, as for the debug APK above.
      - name: Gradle 8.14.3
        env:
          GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          curl -sSfL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      # EDM's key, from the secrets, into a file only this run sees; the release signing of
      # app/build.gradle.kts reads its path and the passwords from the environment.
      - name: EDM's signing key
        run: |
          if [ -z "$EDM_ANDROID_KEYSTORE" ] || [ -z "$EDM_ANDROID_KEYSTORE_PASSWORD" ] \
             || [ -z "$EDM_ANDROID_KEY_ALIAS" ] || [ -z "$EDM_ANDROID_KEY_PASSWORD" ]; then
            echo "::notice::No EDM_ANDROID_KEYSTORE secrets: the release APK goes out unsigned (edm-$VERSION-unsigned.apk), which Android installs only once it is signed"
            exit 0
          fi
          umask 077
          # Whitespace a pasted secret carries (line breaks, a CR, spaces) left out first: GNU
          # base64 refused it as "invalid input" (android-v0.10.1's first run).
          if ! printf '%s' "$EDM_ANDROID_KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/EDM.keystore"; then
            echo "::error::EDM_ANDROID_KEYSTORE is not base64: set it again with base64 < edm-android-release.keystore | gh secret set EDM_ANDROID_KEYSTORE"
            exit 1
          fi
          echo "EDM_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/EDM.keystore" >> "$GITHUB_ENV"
      - name: The release APK
        working-directory: crates/edm-android/android
        run: gradle --no-daemon assembleRelease -Pdm.skipCargo=true "-Pdm.ndkVersion=$EDM_NDK_VERSION" "-Pdm.abis=arm64-v8a,armeabi-v7a,x86_64"
      # The release's merged manifest asks for and opens nothing the kept list does not say,
      # and is not debuggable (gaps row H17, tooling/xtask/src/android_manifest.rs).
      - name: The release manifest is the kept one
        run: cargo xtask android-manifest crates/edm-android/android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
      # Signed, apksigner checks the signature and prints the key's digest, the one people
      # compare (docs/android.md). The APK's SHA-256 goes beside it.
      - name: Named, checked, its SHA-256
        working-directory: crates/edm-android/android/app/build/outputs/apk/release
        run: |
          rm -f "$RUNNER_TEMP/EDM.keystore"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # One APK for each processor and a universal one (app/build.gradle.kts's splits):
          # edm-<version>-arm64-v8a.apk (phones), …-armeabi-v7a, …-x86_64 and …-universal, each
          # "-unsigned" where the repository has no key.
          for apk in app-*-release*.apk; do
            abi="${apk#app-}"
            abi="${abi%%-release*}"
            case "$apk" in
              *-unsigned.apk) name="edm-$VERSION-$abi-unsigned.apk" ;;
              *)
                apksigner verify --verbose --print-certs "$apk"
                # EDM's key and no other (gaps row H22): the digest the README gives people.
                digest="$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
                if ! grep -q "$digest" "$GITHUB_WORKSPACE/README.md" || [ -z "$digest" ]; then
                  echo "::error::$apk is signed by a certificate whose SHA-256 ($digest) is not the README's"
                  exit 1
                fi
                echo "EDM_CERT_SHA256=$digest" >> "$GITHUB_ENV"
                name="edm-$VERSION-$abi.apk"
                ;;
            esac
            cp "$apk" "$GITHUB_WORKSPACE/dist/$name"
          done
          cd "$GITHUB_WORKSPACE/dist"
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
            cat "$apk.sha256"
          done
      # A signed record of which commit and workflow built each file (gaps row H29), kept by
      # GitHub: `gh attestation verify <file> --repo pranavo72bex/Easy-Download-Manager`
      # (docs/RELEASING.md).
      - name: Attest how each file was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.apk
            dist/*.apk.sha256
          draft: true
          make_latest: false
          body: |
            EDM for Android ${{ env.VERSION }}: one APK for arm64-v8a, armeabi-v7a and x86_64,
            Android 10 (API 29) and up. Check it with
            `sha256sum -c edm-${{ env.VERSION }}.apk.sha256`, then open it on the phone and allow
            installing from this source.

            Signed with EDM's key, whose certificate's SHA-256 is
            `${{ env.EDM_CERT_SHA256 }}`: check it with `apksigner verify --print-certs` before
            installing (the README's "Is this APK EDM's own?").

            An APK named `-unsigned` is not signed with EDM's key yet; Android will not install
            it as it is.
