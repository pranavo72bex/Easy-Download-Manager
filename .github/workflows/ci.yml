name: CI

# The browser extension: Rust (browser/) compiled to WebAssembly, a loader
# and two manifests (extension/). Its deciding parts are tested on the
# runner; the WebAssembly is built and zipped for both browsers; and the
# built extension is loaded into Chrome for Testing and watched handing a
# download to a real dm. The desktop app has its own workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Extension (Rust, WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: browser

      - name: Test what it decides
        working-directory: browser
        run: cargo test

      # Twice: the host build sees only the deciding parts, the wasm32 build
      # the browser side as well.
      - name: Refuse warnings
        working-directory: browser
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Check formatting
        working-directory: browser
        run: cargo fmt -- --check

      # Installs the wasm-bindgen CLI matching browser/Cargo.lock, builds the
      # WebAssembly, and refuses a build missing anything a manifest names or
      # carrying JavaScript other than the loader and wasm-bindgen's module.
      - name: Build both store zips
        run: sh scripts/package.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extension-zips
          path: dist/*.zip

  browser:
    name: In Chrome for Testing, handing off to dm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            browser
            desktop

      - name: Linux libraries dm links and Chrome needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev xvfb \
            libnss3 libgbm1 libxkbcommon0 libxkbcommon-x11-0 libxdamage1 libxfixes3 libxrandr2 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          # What the GPUI window (dm-gpui, the window dm ships) builds against.
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev

      - name: Build dm and the extension
        run: |
          (cd desktop && cargo build -p dm-gpui)
          sh scripts/package.sh

      - name: Load it and watch a hand-off
        run: xvfb-run --auto-servernum python3 scripts/chrome-check.py
