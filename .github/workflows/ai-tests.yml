name: AI tests

# Once a day, started by the queue (ai-worker.yml) when no other task waits, the file with
# the most lines no test runs (scripts/coverage-table.py; each system's own code, which a
# Linux runner cannot run, left out) is given to the free AI models (scripts/ai-agent.sh)
# to write tests for. A change is kept only when, besides every check the AI fixer holds a
# change to, that file has fewer lines untested and the workspace's coverage has not gone
# down. A model that finds a bug may fix it, and says so: the pull request lists every
# file changed.
#
# Two jobs, as in ai-fix.yml, because a model's code is never run where a token could
# write: `work` measures, asks the models and checks, read-only, with the models and their
# code run as the user dmbot; the change leaves it only as a patch. `publish` holds the
# write token, applies the patch with git, holds it again to the rules that need no build,
# raises the coverage floor to each whole percent passed, and opens a pull request
# labelled bot:automerge, which ai-merge.yml merges when CI, Desktop and a review pass
# (CI on the branch holds it to the new floor, measured afresh). Each night's file and
# how it ended are a comment on the issue "Nightly AI tests (log)"; a file tried in the
# last fortnight, or with its pull request still open, is not picked again.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'A file to write tests for (else the least covered)'
        required: false
      providers:
        description: 'Providers to try, in order (gemini kilo)'
        required: false
        default: 'gemini kilo'

permissions: {}

concurrency:
  group: ai-tests
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  LOG_TITLE: 'Nightly AI tests (log)'

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      file: ${{ steps.pick.outputs.file }}
      missed: ${{ steps.pick.outputs.missed }}
      total: ${{ steps.pick.outputs.total }}
      provider: ${{ steps.try.outputs.provider }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Two builds of the workspace (the tests', and coverage's instrumented one) and the
      # models' own: more than the runner's free disk (the first run on #57 ran out).
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - name: GPUI's Linux libraries and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest,cargo-llvm-cov

      # main as it is: no model's code yet.
      - name: Coverage now
        run: |
          set -o pipefail
          mkdir -p .bot
          printf '.bot/\n.gemini/\nopencode.json\n' >> .git/info/exclude
          cargo llvm-cov --workspace --locked --summary-only | tee .bot/coverage-before.txt
          # The lines no test runs, file by file, from the same run.
          cargo llvm-cov report --summary-only --show-missing-lines > .bot/missing.txt 2>/dev/null || true

      - name: The file for tonight
        id: pick
        env:
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          log=$(gh issue list --state open --label bot-tests --search "\"$LOG_TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$LOG_TITLE\") | .number" | head -n1)
          : > .bot/skip.txt
          # Tried in the last fortnight, or with a pull request still open: not again.
          since=$(date -u -d '14 days ago' +%FT%TZ)
          if [ -n "$log" ]; then
            gh issue view "$log" --json comments --jq ".comments[] | select(.createdAt > \"$since\") | .body" \
              | grep -oE '^file: [^ ]+' | cut -d' ' -f2 >> .bot/skip.txt || true
          fi
          gh pr list --state open --search 'head:bot/tests-' --json body --jq '.[].body' \
            | grep -oE '^file: [^ ]+' | cut -d' ' -f2 >> .bot/skip.txt || true
          if [ -n "$FILE" ]; then
            [[ "$FILE" =~ ^[A-Za-z0-9_./-]+\.rs$ ]] || { echo "::error::not a Rust file: $FILE"; exit 1; }
            missed=$(python3 scripts/coverage-table.py missed .bot/coverage-before.txt "$FILE")
            picked="$FILE ? $missed"
          else
            mapfile -t skip < .bot/skip.txt
            picked=$(python3 scripts/coverage-table.py pick .bot/coverage-before.txt "${skip[@]}")
          fi
          if [ -z "$picked" ]; then echo "No file left to pick."; exit 0; fi
          read -r file lines missed <<<"$picked"
          echo "Tonight: $file ($missed of $lines lines untested)"
          { echo "file=$file"; echo "missed=$missed"; } >> "$GITHUB_OUTPUT"
          echo "total=$(python3 scripts/coverage-table.py total .bot/coverage-before.txt)" >> "$GITHUB_OUTPUT"
          grep -F "$file" .bot/missing.txt > .bot/missing-lines.txt || true

      - name: The agents
        if: steps.pick.outputs.file != ''
        run: npm install -g @google/gemini-cli@0.68.0 opencode-ai@1.19.5

      - name: The task
        if: steps.pick.outputs.file != ''
        env:
          FILE: ${{ steps.pick.outputs.file }}
          MISSED: ${{ steps.pick.outputs.missed }}
        run: |
          cat > .bot/prompt.md <<EOF
          You are writing tests for one file of this repository (a Rust download manager, Cargo workspace at the root, crates in crates/): $FILE, where $MISSED lines are run by no test.

          1. Read CLAUDE.md, AGENTS.md, docs/behaviour-contract.md and docs/ai-notes.md first and follow them. You are a bot working unattended: no person will answer a question.
          2. The lines no test runs are listed in .bot/missing-lines.txt (it may be empty; then read the file and its existing tests to see what is untested).
          3. Write tests that run those lines, in the style the crate already uses: the file's own #[cfg(test)] module or its tests/ module, the crate's tests/ directory, and the helpers the crate's tests already have.
          4. Test what the code is meant to do (its doc comments, docs/, the behaviour contract), not just what it happens to return. If a test shows the code is wrong, fix the code with the smallest change and say so in the summary.
          5. Security comes first: a test reaches no address but 127.0.0.1, writes only in a temporary directory, and reads no file outside the repository. Add no network access, process spawning, \`unsafe\` or dependency to the code.
          6. Do not change any behaviour listed in docs/behaviour-contract.md, the window's layout, dialogs or wording. Do not edit .github/, scripts/, tooling/xtask/, .config/, .cargo/, Cargo.lock, CLAUDE.md, AGENTS.md, docs/ai-notes.md or the coverage floors; add no symbolic link. Do not remove, weaken or ignore a test.
          7. Check your work: \`cargo fmt --all\`, \`cargo clippy --workspace --all-targets --locked -- -D warnings\`, the crate's tests (\`cargo nextest run -p CRATE\`), then \`cargo xtask test --profile ci\`.
          8. Do not commit. Write a short summary to .bot/summary.md: what the tests cover, and any bug found and fixed.
          EOF

      - name: Ask the models
        id: try
        if: steps.pick.outputs.file != ''
        env:
          PROVIDERS: ${{ inputs.providers || 'gemini kilo' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KILO_MODEL: ${{ vars.KILO_MODEL }}
          FILE: ${{ steps.pick.outputs.file }}
          MISSED: ${{ steps.pick.outputs.missed }}
          TOTAL_BEFORE: ${{ steps.pick.outputs.total }}
          GH_TOKEN: '' # the models' step holds no GitHub token, not even a read-only one
        run: |
          # The models, and every program their code becomes, run as dmbot (see ai-fix.yml):
          # killed, every process, before the next step.
          sudo useradd -m -s /bin/bash dmbot 2>/dev/null || true
          sudo chmod a+x "$HOME" "$HOME/work"
          sudo chmod -R a+rwX "$HOME/.cargo" "$HOME/.rustup"
          sudo chown -R dmbot "$GITHUB_WORKSPACE"
          sudo -u dmbot -H env -i HOME=/home/dmbot USER=dmbot PATH="$HOME/.cargo/bin:$PATH" \
            CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            GEMINI_API_KEY="$GEMINI_API_KEY" GEMINI_MODEL="$GEMINI_MODEL" KILO_MODEL="$KILO_MODEL" \
            PROVIDERS="$PROVIDERS" FILE="$FILE" MISSED="$MISSED" TOTAL_BEFORE="$TOTAL_BEFORE" \
            GITHUB_OUTPUT=.bot/outputs CI=true TERM=dumb CARGO_TERM_COLOR=never \
            bash -c '
              set +e -uo pipefail
              cd "$0"
              . scripts/ai-agent.sh
              # Kept only when the file has fewer lines untested and the whole has not gone down.
              ai_extra_check() {
                local after total
                after=$(python3 scripts/coverage-table.py missed .bot/coverage.txt "$FILE" 2>/dev/null)
                total=$(python3 scripts/coverage-table.py total .bot/coverage.txt 2>/dev/null)
                echo "$FILE: $MISSED lines untested before, ${after:-?} after; the workspace $TOTAL_BEFORE% before, ${total:-?}% after" >> .bot/check.log
                if [ -n "$after" ] && [ "$after" -lt "$MISSED" ] && \
                   python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) >= float(sys.argv[2]) else 1)" "$total" "$TOTAL_BEFORE"; then
                  echo pass
                else
                  echo no-coverage-gain
                fi
              }
              ai_setup
              if ai_try .bot/prompt.md; then ai_patch .bot/result.patch; fi
              exit 0' "$GITHUB_WORKSPACE"
          sudo pkill -9 -u dmbot || true
          sleep 2
          sudo pkill -9 -u dmbot || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          provider=$(grep -oxE 'provider=(gemini|kilo)' .bot/outputs 2>/dev/null | head -n1 | cut -d= -f2 || true)
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          exit 0

      - name: What leaves this job
        if: always()
        run: |
          mkdir -p .bot/out
          # Regular files only: a link left by the models is not followed.
          for f in result.patch summary.md check.log coverage.txt; do
            if [ -f ".bot/$f" ] && [ ! -L ".bot/$f" ]; then tail -c 400000 ".bot/$f" > ".bot/out/$f"; fi
          done
          true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ai-tests
          path: .bot/out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: work
    if: always() && needs.work.outputs.file != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write # CI and Desktop on the branch; the worker again
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FILE: ${{ needs.work.outputs.file }}
      MISSED: ${{ needs.work.outputs.missed }}
      TOTAL_BEFORE: ${{ needs.work.outputs.total }}
      PROVIDER: ${{ needs.work.outputs.provider }}
      WORKED: ${{ needs.work.result }}
    steps:
      # main's own scripts: the rules come from here.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: ai-tests
          path: .bot/
      - name: The log issue
        id: log
        run: |
          gh label create bot-tests --color 0e8a16 --description 'The nightly AI tests' 2>/dev/null || true
          gh label create bot:automerge --color ededed --description "dm's bot" 2>/dev/null || true
          log=$(gh issue list --state open --label bot-tests --search "\"$LOG_TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$LOG_TITLE\") | .number" | head -n1)
          if [ -z "$log" ]; then
            url=$(gh issue create --title "$LOG_TITLE" --label bot-tests \
              --body "Each night's file and how it ended (.github/workflows/ai-tests.yml).")
            log=${url##*/}
          fi
          echo "log=$log" >> "$GITHUB_OUTPUT"

      - name: Apply, check again, and open the pull request
        id: publish
        if: env.PROVIDER != '' && env.WORKED == 'success'
        env:
          LOG: ${{ steps.log.outputs.log }}
        run: |
          set -euo pipefail
          printf '.bot/\n' >> .git/info/exclude
          # shellcheck source=/dev/null
          . scripts/ai-agent.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          [[ "$FILE" =~ ^[A-Za-z0-9_./-]+\.rs$ ]] || exit 1
          [ -s .bot/result.patch ] || { echo "::error::no patch"; exit 1; }
          slug=$(echo "$FILE" | tr '/.' '--' | tr -cd 'A-Za-z0-9-' | tail -c 60)
          branch="bot/tests-$slug"
          git switch -q -c "$branch"
          git apply --whitespace=nowarn .bot/result.patch
          : > .bot/check.log
          guard=$(ai_guard)
          if [ "$guard" != ok ]; then
            echo "::error::the patch breaks a rule ($guard)"; cat .bot/check.log
            echo "refused=$guard" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Numbers from the work job are only said here; CI on the branch measures afresh.
          after=$(python3 scripts/coverage-table.py missed .bot/coverage.txt "$FILE" 2>/dev/null || echo '?')
          total=$(python3 scripts/coverage-table.py total .bot/coverage.txt 2>/dev/null || echo 0)
          [[ "$total" =~ ^[0-9]+(\.[0-9]+)?$ ]] || total=0
          # The floor goes up to each whole percent passed, one at a time; never down.
          floor=$(cat docs/coverage-floor.txt)
          raised=$(python3 -c "import math,sys; f=int(sys.argv[1]); print(min(f + 1, max(f, math.floor(float(sys.argv[2])))))" "$floor" "$total")
          floor_note="The coverage floor stays at $floor%."
          if [ "$raised" -gt "$floor" ]; then
            echo "$raised" > docs/coverage-floor.txt
            floor_note="The coverage floor is raised from $floor% to $raised%."
          fi
          git add -A -- .
          changed=$(git diff --cached --name-only | sed 's/^/- /')
          git commit -q -m "Tests for $FILE ($PROVIDER) [bot]"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$branch"
          gh workflow run ci.yml --ref "$branch" || true
          gh workflow run desktop.yml --ref "$branch" -f bundles=false || true
          summary=$(head -c 6000 .bot/summary.md 2>/dev/null || echo 'No summary written.')
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          body=$(printf 'file: %s\ntask: tests\norigin: ai\n\nTests by **%s**: %s lines of this file untested before, %s after; the workspace %s%% of lines before, %s%% after. %s\n\n%s\n\nFiles changed (a file other than tests is a fix the tests led to):\n%s\n\nIn the run, on Linux: no guardrail touched, no test removed or ignored, format, clippy, layering, headers, privacy, `cargo xtask test --profile ci` and the coverage floor passed. CI and Desktop (Linux, Windows, macOS) run on this branch; ai-merge.yml merges it when they and its review pass.\n' \
            "$FILE" "$PROVIDER" "$MISSED" "$after" "$TOTAL_BEFORE" "$total" "$floor_note" "$summary" "$changed")
          url=$(gh pr create --head "$branch" --title "Tests for $FILE ($PROVIDER) [bot]" --body "$body" --label bot:automerge)
          gh issue comment "$LOG" --body "$(printf 'file: %s\n\n%s: pull request %s (%s → %s lines untested; %s%% → %s%%) ([run](%s))\n' \
            "$FILE" "$PROVIDER" "$url" "$MISSED" "$after" "$TOTAL_BEFORE" "$total" "$RUN_URL")"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Say how the night ended
        if: always() && steps.publish.outputs.done != 'true'
        env:
          LOG: ${{ steps.log.outputs.log }}
          REFUSED: ${{ steps.publish.outputs.refused }}
        run: |
          why='No model wrote tests that pass the checks and raise its coverage.'
          if [ -n "$REFUSED" ]; then why="A change passed in the work job but broke a rule when checked again ($REFUSED): refused."; fi
          if [ "$WORKED" != success ]; then why="The work job did not finish ($WORKED)."; fi
          gh issue comment "$LOG" --body "$(printf 'file: %s\n\n%s ([run](%s))\n' "$FILE" "$why" "$RUN_URL")"

      - name: Next in the queue
        if: always()
        run: gh workflow run ai-worker.yml || true
