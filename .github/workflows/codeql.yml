name: CodeQL

# GitHub's code scanning over EDM's Rust, its Python scripts and these workflows: what a
# reviewer's eye misses (a path from a web page to a file write, a string run as a command, a
# workflow that hands a token to code it checked out). Free for a public repository.
#
# Gates the bots (the maintainer, 2026-11-26): scripts/ai-merge.sh starts this on a bot's
# branch and merges only when it raises no alert that main does not already have. For a
# person's change it is reported in the pull request's checks and the Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: Code scanning (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # the results, to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
