name: Solver update

# YouTube's player changes, and the two small scripts dm answers its checks with (pinned by
# version and checksum in desktop/crates/dm-core/src/youtube.rs) stop matching: videos stop
# downloading or crawl. Weekly, this asks the scripts' project for its latest release; if there is
# a newer one it rewrites the pin (scripts/update-solver.py), runs the offline YouTube tests and
# opens a pull request. It never merges: a person runs a real YouTube video first (the offline
# tests do not use the real scripts), and the pinned checksum only protects if a person looks at
# each change. Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Settings > Actions > General; a pull request made with the workflow's own token
# does not start the other workflows, so the tests below are the ones that run for it.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: look for newer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test the updater
        run: python3 scripts/test-update-solver.py
      - name: Update the pin
        run: python3 scripts/update-solver.py --apply --summary-file "$RUNNER_TEMP/summary.md"
      - name: Run the offline YouTube tests with the new pin
        working-directory: desktop
        run: |
          if git diff --quiet -- desktop/crates/dm-core/src/youtube.rs; then echo "the pin is current"; exit 0; fi
          cargo test -p dm-core youtube
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- desktop/crates/dm-core/src/youtube.rs; then exit 0; fi
          version=$(sed -n 's/^const SOLVER_VERSION: &str = "\([0-9.]*\)";$/\1/p' desktop/crates/dm-core/src/youtube.rs)
          branch="solver-update/$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch is already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add desktop/crates/dm-core/src/youtube.rs
          git commit -m "The YouTube challenge scripts: pinned release $version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "The YouTube challenge scripts: release $version" \
            --body-file "$RUNNER_TEMP/summary.md"
