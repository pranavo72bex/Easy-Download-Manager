name: Desktop

# Packaging is the one thing that cannot be done from a development machine:
# each platform's installer is built on that platform, then installed there
# and run (scripts/smoke.py) before anything is released. The window is
# drawn in Rust with GPUI and the Linux tray speaks D-Bus, so nothing links
# GTK; what Linux needs at run time is what GPUI links and opens, which the
# packages name.
# No `paths` filter on the push trigger: a tag push evaluates paths against a
# range that is often empty, so filtering here is how a release quietly fails
# to build. The expensive jobs are gated below instead.
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
    paths: ["crates/**", "tooling/**", "assets/**", "vendor/**", "packaging/**", "Cargo.toml", "Cargo.lock", ".cargo/**", 'scripts/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

# Read-only by default: builds and tests run on pull requests too. Only the
# release job, on a tag, writes (it drafts the release).
permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main and on
# tags always finish, so every state that lands is checked to the end.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in a panic's backtrace, without the rest of the debug
  # info: faster builds and links, a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    # Linux, Windows and macOS on every push. macOS was left to the developer's
    # Mac while the repository was private (GitHub billed a macOS minute as
    # ten); public since 2026-11-06, its minutes cost nothing, and its tests
    # had run nowhere but one Mac.
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          components: clippy, rustfmt

      # Only main saves the cache; a pull request restores main's rather
      # than writing a copy of its own that pushes main's out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The cheap checks first: a formatting or lint failure is red in a
      # few minutes rather than after the tests.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The window (dm-gpui, GPUI) builds against these on Linux.
      - name: GPUI's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev

      - name: Refuse warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Dependency layering
        run: cargo xtask layers

      - name: Every source file carries its licence header
        run: cargo xtask headers

      # nextest runs the test binaries side by side (cargo test runs them
      # one after another) and fails a test that hangs; doctests, which it
      # does not run, follow, in the same step: `cargo xtask test`, as
      # anyone runs the tests on any system (gaps row X7).
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest

      # The Chinese, Japanese and Korean catalogs are drawn in the computer's
      # CJK font, which a desktop has and this runner does not.
      - name: Install a CJK font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev

      - name: Test the engine, the shell and the window, then the doctests
        run: cargo xtask test --profile ci

      # The log is the administrators' alone; the annotations are anyone's.
      # Run on a pass too: a test that needed a retry is named as flaky.
      - name: Name the tests that failed or needed a retry
        if: always()
        shell: bash
        run: python3 scripts/ci-failed-tests.py target/nextest/ci/junit.xml || python scripts/ci-failed-tests.py target/nextest/ci/junit.xml

  coverage:
    # Line coverage of the desktop workspace, held to a floor that is only ever raised (the
    # maintainer, 2026-11-08: over 90%). The run fails below it, so tests that are taken away
    # or code added untested shows here rather than in a later bug.
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - name: Install a CJK font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - name: Measure, and hold to the floor
        run: |
          floor=$(cat docs/coverage-floor.txt)
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines "$floor" | tee coverage.txt
      - name: Say the total in the run's summary
        if: always()
        run: grep -E '^TOTAL' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true

  packaging-lint:
    # Seconds, no Rust build: the shell scripts, the workflows and the Linux
    # desktop entry, which a release depends on and nothing else checks.
    name: Packaging lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Shell scripts
        run: shellcheck -f gcc scripts/*.sh scripts/*/*.sh
      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/*.yml
      - name: Desktop entry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/dm.desktop

  bundle:
    name: ${{ matrix.name }}
    needs: [test, packaging-lint]
    # Every platform's installers are minutes of compute; an ordinary push
    # wants to know the tests still pass, not to be handed an installer.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (deb, AppImage, rpm)
            # Pinned deliberately: an AppImage built against a newer glibc
            # will not start on an older distribution.
            os: ubuntu-22.04
            formats: deb,appimage
            artifact: linux-x86_64
            # The GPUI window.
            crate: dm-gpui
          - name: Linux arm64 (deb, AppImage, rpm)
            os: ubuntu-22.04-arm
            formats: deb,appimage
            artifact: linux-arm64
            # The GPUI window.
            crate: dm-gpui
          - name: Windows (NSIS installer)
            os: windows-latest
            formats: nsis
            artifact: windows
            # The GPUI window.
            crate: dm-gpui
          - name: macOS (app, dmg)
            os: macos-latest
            formats: app,dmg
            artifact: macos
            # The GPUI window.
            crate: dm-gpui
          # Intel Macs (gaps row R3): built for x86_64 on the same Apple
          # silicon runner, a .dmg of its own (dm_<version>_x64.dmg), which
          # the update check offers an Intel Mac (`update::installer_in`).
          - name: macOS Intel (app, dmg)
            os: macos-latest
            formats: app,dmg
            artifact: macos-x64
            crate: dm-gpui
            target: x86_64-apple-darwin
            size-key: macos-x86_64
          # Windows on Arm (gaps row R3): built on GitHub's Arm Windows
          # runner, as Linux arm64 is on its Arm runner, an installer of its
          # own (dm_<version>_arm64-setup.exe) and a portable zip
          # (dm_<version>_arm64-portable.zip). The update check offers that
          # installer to an arm64 Windows (`update::installer_in`). The target
          # is named, so the build is Arm's whatever the runner's Rust is.
          - name: Windows on Arm (NSIS installer)
            os: windows-11-arm
            formats: nsis
            artifact: windows-arm64
            crate: dm-gpui
            target: aarch64-pc-windows-msvc
            size-key: windows-arm64

    runs-on: ${{ matrix.os }}
    # Where cargo puts the build: under the target's own folder when one is named.
    env:
      OUT: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # The toolchain step below needs rustup already there on Windows; the
      # Arm Windows runner's image may come without it, so its Arm build is
      # put there first (gaps row R3). Nothing is done where it is present.
      - name: rustup, on Windows on Arm
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.cargo\bin')
          }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: ${{ matrix.target }}
      # ring (rustls' cryptography) builds its C and assembly for Arm Windows
      # with clang alone, not MSVC's cl (cargo check for that target stops at
      # "failed to find tool clang" without it). The runner's own where it
      # has one (on the path, LLVM's folder, Visual Studio's Clang tools),
      # else LLVM's Arm64 Windows build, installed silently.
      - name: clang, on Windows on Arm
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) { clang --version; exit 0 }
          $dirs = @(Join-Path $env:ProgramFiles 'LLVM\bin')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            if ($vs) { $dirs += Join-Path $vs 'VC\Tools\Llvm\ARM64\bin' }
          }
          foreach ($d in $dirs) {
            if (Test-Path (Join-Path $d 'clang.exe')) {
              Add-Content $env:GITHUB_PATH $d
              & (Join-Path $d 'clang.exe') --version
              exit 0
            }
          }
          $setup = Join-Path $env:RUNNER_TEMP 'llvm-setup.exe'
          Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile $setup
          Start-Process $setup -ArgumentList '/S' -Wait
          $d = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $d 'clang.exe'))) { throw 'no clang.exe after installing LLVM' }
          Add-Content $env:GITHUB_PATH $d
          & (Join-Path $d 'clang.exe') --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bundle-${{ matrix.artifact }}

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf file desktop-file-utils \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev

      - name: cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # CI is set on every runner, which is what tells the .dmg step to skip
      # the Finder AppleScript a headless machine cannot run.
      - name: Build the installers
        working-directory: crates/${{ matrix.crate }}
        # Apple: a Developer ID certificate and an app-specific password, from
        # the repository's Actions secrets. Absent, the macOS build is
        # unsigned and Gatekeeper refuses it until someone right-clicks and
        # chooses Open. Handed on only when set: an unset secret arrives as an
        # empty value, which cargo-packager took for a certificate to import,
        # and the build failed. The identity goes in Cargo.toml
        # (packager.macos.signingIdentity).
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value_name="SECRET_$name"
            if [ -n "${!value_name}" ]; then export "$name=${!value_name}"; fi
            unset "$value_name"
          done
          # Without the runner's paths in the binary (scripts/release-flags.sh);
          # Windows keeps its own target flags, which this does not replace.
          # Set, then exported: `export X="$(…)"` hides the command's failure
          # (shellcheck SC2155, which failed the packaging lint).
          CARGO_BUILD_RUSTFLAGS="$(sh ../../scripts/release-flags.sh)"
          export CARGO_BUILD_RUSTFLAGS
          # A named target (the Intel Mac's) for the packager's own
          # beforePackagingCommand too, which has no --target: without it that
          # build was the runner's arm64 one, in target/release, and the
          # packager found nothing in target/<target>/release to put in dm.app.
          if [ -n "${{ matrix.target }}" ]; then export CARGO_BUILD_TARGET=${{ matrix.target }}; fi
          # This crate's packages alone: without -p, cargo-packager packages every
          # crate of the workspace that has packager settings.
          cargo packager --release -p ${{ matrix.crate }} --formats ${{ matrix.formats }} \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        # This step's own: the check below was put between its run and its env,
        # and took the signing secrets from it.
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # dm's Safari extension into dm.app, and that dm.app into the .dmg in
      # place of the packager's (gaps row R4): cargo-packager makes both in
      # one run, so the .dmg is opened again (scripts/safari-extension.sh
      # --dmg). Built for the job's target, as dm.app is.
      - name: The Safari extension, in dm.app and the dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          CARGO_BUILD_RUSTFLAGS="$(sh scripts/release-flags.sh)"
          export CARGO_BUILD_RUSTFLAGS
          if [ -n "${{ matrix.target }}" ]; then export CARGO_BUILD_TARGET=${{ matrix.target }}; fi
          dmg=$(find target/release/bundle -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$dmg"
          sh scripts/safari-extension.sh target/release/bundle/dm.app --dmg "$dmg"
          program="target/release/bundle/dm.app/Contents/PlugIns/dm Safari Extension.appex/Contents/MacOS/dm-safari"
          found=$(strings "$program" | grep -c -e "$HOME" -e "$GITHUB_WORKSPACE" || true)
          echo "paths of this runner in dm-safari: $found"
          test "$found" = 0

      - name: No build paths in what ships
        if: runner.os != 'Windows'
        shell: bash
        run: |
          found=$(strings "$OUT/${{ matrix.crate }}" | grep -c -e "$HOME" -e "$GITHUB_WORKSPACE" || true)
          echo "paths of this runner in the binary: $found"
          test "$found" = 0

      # The binary's size on each system, against the one recorded in
      # scripts/binary-size.json: a jump of more than 10% fails the build
      # (a profile changed, a crate added by mistake), anything less is only
      # said, in the log and in the run's summary.
      - name: The binary's size
        shell: bash
        run: |
          binary="$OUT/${{ matrix.crate }}"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          py=python3; command -v python3 >/dev/null || py=python
          # A cross build is held to its own system's size, not the runner's.
          "$py" scripts/binary-size.py "$binary" ${{ matrix.size-key && format('--as={0}', matrix.size-key) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"

      # Fedora, openSUSE and their kin: the same binary, laid out as the
      # Arch package is (packaging/nfpm.yaml).
      - name: The rpm
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/${{ matrix.crate }}/Cargo.toml | head -1)
          sh scripts/linux/nfpm.sh target/release/${{ matrix.crate }} "$version" target/release/bundle

      # cargo-packager names the .deb, the AppImage and the Windows installer
      # after the binary (dm-gpui_…) and only the .dmg after the
      # product; one name for all of them, the one the README and the update
      # check use. Only this job's crate's, so another's left in the folder
      # is never renamed over it.
      - name: Name the installers dm
        shell: bash
        # The packager's outDir, the same for a named target (the Intel Mac's).
        working-directory: target/release/bundle
        run: |
          for f in ${{ matrix.crate }}_*; do
            [ -e "$f" ] || continue
            mv -v "$f" "dm_${f#*_}"
          done
          ls

      # For Windows people who cannot, or will not, run an installer: the
      # program alone, with the empty file named `portable` that makes dm keep
      # its settings and list in a `dm-data` folder beside it
      # (dm_shell::settings::PORTABLE_MARKER). Zipped under a folder of its
      # own, so unzipping it does not scatter files. Windows on Arm's is
      # named arm64, as its installer is, and holds its own build.
      - name: The portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/${{ matrix.crate }}/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $arch = if ('${{ matrix.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          $dir = Join-Path target/release/bundle "dm_${version}_${arch}-portable"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "$env:OUT/${{ matrix.crate }}.exe" $dir
          New-Item -ItemType File -Path (Join-Path $dir 'portable') | Out-Null
          Copy-Item packaging/portable-readme.txt (Join-Path $dir 'README.txt')
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Remove-Item -Recurse $dir
          Get-ChildItem target/release/bundle

      - name: Keep the installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dm-${{ matrix.artifact }}
          path: |
            target/release/bundle/*.deb
            target/release/bundle/*.rpm
            target/release/bundle/*.AppImage
            target/release/bundle/*-setup.exe
            target/release/bundle/*-portable.zip
            target/release/bundle/*.dmg
          if-no-files-found: error

  installed:
    # Each installer installed the way a person installs it, the installed dm
    # run (scripts/smoke.py: native host, window, a download byte-exact) and
    # removed again. A release is drafted only when every one passes.
    name: Install and run (${{ matrix.artifact }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, artifact: linux-x86_64 }
          - { os: ubuntu-22.04-arm, artifact: linux-arm64 }
          # `machine`: the PE machine type the installed dm-gpui.exe must
          # be, x64 (8664) or ARM64 (AA64): the Arm runner runs an x64
          # program too, under emulation, so passing smoke.py alone would not
          # say the Arm build is Arm's (gaps row R3).
          - { os: windows-latest, artifact: windows, machine: '8664' }
          - { os: windows-11-arm, artifact: windows-arm64, machine: AA64 }
          - { os: macos-latest, artifact: macos }
          # The Intel build run where it can be: under Rosetta on the Apple
          # silicon runner, as many Intel apps run on a person's Mac.
          - { os: macos-latest, artifact: macos-x64, rosetta: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dm-${{ matrix.artifact }}
          path: installers

      - name: Linux display
        if: runner.os == 'Linux'
        # Mesa's software Vulkan too: the window draws with it where there is no GPU.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1

      - name: The .deb, through apt
        if: runner.os == 'Linux'
        run: |
          set -e
          deb=$(find installers -name '*.deb' | head -1)
          package=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "./$deb"
          binary=$(dpkg -L "$package" | grep '/bin/' | head -1)
          xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/smoke.py "$binary"
          sudo apt-get remove -y "$package"
          test ! -e "$binary"

      - name: The AppImage
        if: runner.os == 'Linux'
        env:
          # A runner has no FUSE; the AppImage unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -e
          image=$(find installers -name '*.AppImage' | head -1)
          chmod +x "$image"
          xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/smoke.py "$image"

      - name: The .rpm, through dnf on Fedora
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:41 sh -c '
            set -e
            dnf install -y -q python3 xorg-x11-server-Xvfb installers/*.rpm >/dev/null
            xvfb-run -a -s "-screen 0 1280x800x24" python3 scripts/smoke.py /usr/bin/dm
            dnf remove -y -q dm >/dev/null
            test ! -e /usr/bin/dm'

      - name: The Windows installer, silently
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          # The GPUI window, the one dm ships.
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter 'dm-gpui.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installer put no dm-gpui.exe anywhere' }
          # The machine it is built for, from its PE header: the 16-bit
          # machine field four bytes after the "PE\0\0" the offset at 0x3C names.
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550) { throw 'dm-gpui.exe has no PE header' }
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Output "dm-gpui.exe is for machine 0x$machine"
          if ($machine -ne '${{ matrix.machine }}') { throw "dm-gpui.exe is for machine 0x$machine, not 0x${{ matrix.machine }}" }
          # The runner has no graphics driver: GPUI draws through Direct3D 11
          # on Windows' own software adapter (WARP), with nothing beside the
          # program, as a computer with no GPU does (docs/decisions.md,
          # 2026-11-11).
          python scripts/smoke.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Get-ChildItem $exe.DirectoryName -Filter 'uninstall*.exe' | Select-Object -First 1
          Start-Process $uninstall.FullName -ArgumentList '/S' -Wait
          # The uninstaller hands itself to a copy and returns at once.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep 1 }
          if (Test-Path $exe.FullName) { throw 'uninstalling left dm-gpui.exe behind' }

      # The zip a person unzips and runs from wherever they put it: its data
      # lands in `dm-data` beside it and nowhere else (scripts/portable-check.py).
      - name: The Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem installers -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no portable zip was built' }
          Expand-Archive $zip.FullName -DestinationPath portable-unzipped
          $exe = Get-ChildItem portable-unzipped -Recurse -Filter 'dm-gpui.exe' | Select-Object -First 1
          if (-not $exe) { throw 'the portable zip holds no dm-gpui.exe' }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'portable'))) { throw 'the portable zip holds no `portable` file beside the program' }
          python scripts/portable-check.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rosetta, for the Intel build
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: The macOS app, from the dmg
        if: runner.os == 'macOS'
        run: |
          set -e
          dmg=$(find installers -name '*.dmg' | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dm" "$dmg"
          cp -R "$RUNNER_TEMP/dm/dm.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dm"
          # The Intel build is Intel's alone, not Apple silicon's run by mistake.
          if [ "${{ matrix.rosetta }}" = true ]; then
            test "$(lipo -archs "$RUNNER_TEMP/dm.app/Contents/MacOS/dm-gpui")" = x86_64
          fi
          # The Safari extension came with it, for the same machine (gaps row R4).
          appex="$RUNNER_TEMP/dm.app/Contents/PlugIns/dm Safari Extension.appex"
          test -f "$appex/Contents/Resources/manifest.json"
          test "$(lipo -archs "$appex/Contents/MacOS/dm-safari")" = "$(lipo -archs "$RUNNER_TEMP/dm.app/Contents/MacOS/dm-gpui")"
          codesign --verify --deep --strict "$RUNNER_TEMP/dm.app"
          python3 scripts/smoke.py "$RUNNER_TEMP/dm.app/Contents/MacOS/dm-gpui"
          rm -rf "$RUNNER_TEMP/dm.app"

  extension:
    name: The browser extension (zips)
    # On the same page as the installers, so a person downloads both from
    # one place: the app and the extension that hands it downloads.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: Build the Chrome and Firefox zips
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dm-extension
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft the release
    # Every installer built, installed and run on its own system, and the
    # Arch package built and installed: one failure and nothing is drafted.
    needs: [bundle, installed, extension, arch]
    # Only a tag publishes; a manual run stops at the artefacts.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: installers
          merge-multiple: true

      # What a running dm reads to say a newer version is out, and where the
      # installer for its machine is: dm downloads it as any other download
      # when the person asks, and they open it. Nothing installs itself.
      - name: The update manifest
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          installers=$(find installers -maxdepth 1 -type f -printf '%f\n' | sort \
            | jq -R --arg base "$base" '"\($base)/\(.)"' | jq -s .)
          # Each installer's SHA-256 by its name: dm checks the one it
          # downloads against it and removes one that does not match.
          digests=$(cd installers && find . -maxdepth 1 -type f -printf '%f\n' | sort \
            | xargs -d '\n' sha256sum \
            | jq -R 'capture("^(?<d>[0-9a-f]{64})  (?<f>.+)$") | {(.f): .d}' | jq -s 'add // {}')
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson installers "$installers" --argjson sha256 "$digests" \
            '{version: $version, pub_date: $date, notes: $notes, installers: $installers, sha256: $sha256}' \
            > installers/latest.json
          cat installers/latest.json

      # dm believes a manifest only with the project's signature beside it,
      # `latest.json.sig` (gaps row F6; dm-shell's app/update.rs). The private
      # key is the repository secret DM_UPDATE_SIGNING_KEY, made by
      # `cargo xtask update-key` (docs/RELEASING.md); the signer refuses a key
      # that is not the one dm carries. Without it this step fails and nothing
      # is drafted: an unsigned release is one every dm since F6 refuses.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
      - name: Sign the update manifest
        env:
          DM_UPDATE_SIGNING_KEY: ${{ secrets.DM_UPDATE_SIGNING_KEY }}
        run: cargo xtask sign-manifest installers/latest.json

      # What the release is built from and that its files are the ones published
      # (gaps row W21): `crates.txt`, every crate and version in the app and the
      # extension, from Cargo.lock; `SHA256SUMS`, the digest of every file here
      # (latest.json, its signature and the crate list too), and `SHA256SUMS.sig`,
      # its signature by the same key as latest.json's. Checked against the key dm
      # carries before anything is drafted; anyone checks a download the same way
      # (`cargo xtask verify-release`, docs/RELEASING.md). Fails without the secret
      # as the step above does.
      - name: The crate list and the signed digests
        env:
          DM_UPDATE_SIGNING_KEY: ${{ secrets.DM_UPDATE_SIGNING_KEY }}
        run: |
          cargo xtask crates-list installers/crates.txt
          cargo xtask sign-release installers
          cargo xtask verify-release installers

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: dm ${{ github.ref_name }}
          # SignPath Foundation asks that every release page link the policy.
          body: |
            [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)
          files: installers/*

  arch:
    name: Arch package
    needs: test
    # Arch has no runner, so the package is built in Arch's own container,
    # against Arch's own libraries.
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # On every push, not only for a tag: the release PKGBUILD through
      # makepkg from this checkout (build, its check(), package), installed
      # with pacman, and the installed dm asked to answer a hand-off. The
      # same script `scripts/arch-check.sh` runs locally.
      - name: Build, check and install the Arch package from this checkout
        run: sh scripts/arch/inside.sh

      # A tag also builds the package the way an AUR user would, from the
      # tag's GitHub archive.
      - name: Build the release package from the tag's archive
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: packaging
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          # The digest in the PKGBUILD is the last release's, pinned once its
          # tag existed; this tag's archive has none yet to be held to.
          sed -i -e "s/^pkgver=.*/pkgver=$version/" -e "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "makepkg --cleanbuild --nodeps --noconfirm"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dm-arch-package-from-checkout
          path: /home/builder/pkg/*.pkg.tar.*
          if-no-files-found: error

      - name: Upload the Arch package
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dm-arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error
