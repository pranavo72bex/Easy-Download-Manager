name: Secret scan

# Secrets (keys, tokens, passwords) in what is pushed, found by gitleaks with its own rules
# and the one allowance in .gitleaks.toml. Each push to any branch: the commits it adds
# (a new branch: those not on the default branch; a push that rewrote history: all of it).
# Run by hand, it scans the whole history. The GitGuardian app checks pull requests as well.
# Findings are printed with the secret itself hidden (--redact): this repository is public.
# No account or key is needed. gitleaks is the release binary, checked against its
# published SHA-256 before it runs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # the push's commits, back to the one before it
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          zero=0000000000000000000000000000000000000000
          range=
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$BEFORE" HEAD; then
              range="$BEFORE..HEAD"
            elif [ "$GITHUB_REF_NAME" != "$DEFAULT" ]; then
              range="origin/$DEFAULT..HEAD"
            fi
          fi
          echo "Scanning: ${range:-the whole history}"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose \
            ${range:+--log-opts="$range"} .
