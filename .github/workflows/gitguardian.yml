name: GitGuardian

# Secrets (keys, tokens, passwords) in what is pushed, found by GitGuardian's ggshield.
# The GitGuardian app already checks every pull request ("GitGuardian Security Checks");
# this checks each push, to main and to any other branch, so a commit pushed straight to
# main is scanned too. Only the commits a push adds are scanned, not the whole history.
# Needs the repository secret GITGUARDIAN_API_KEY (a GitGuardian key with the `scan`
# scope); without it the run fails and says so. Secrets already resolved in GitGuardian's
# dashboard are not reported again (--ignore-known-secrets).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: GitGuardian secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The key is set
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::The repository secret GITGUARDIAN_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # the push's commits, back to the one before it
          persist-credentials: false
      - name: ggshield secret scan ci
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        with:
          args: --ignore-known-secrets
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
