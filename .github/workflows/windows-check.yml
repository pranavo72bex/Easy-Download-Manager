name: Windows, the app driven end to end

# Started by hand (Actions › this workflow › Run workflow). The real
# dm-gpui.exe (the GPUI window, the one dm ships on Windows: docs/gaps.md G9)
# on Windows, driven by scripts/app-check.py as it is on
# macOS and Linux: one dm at a time and links handed to it, a browser's
# hand-off through the native host, downloads sorted by kind, an HLS stream
# and a player page that is not YouTube's, refused, a proxy not gone around, a speed limit and a
# schedule, the login item's launch, the command line, the control protocol,
# headless and MCP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows, app-check
    runs-on: windows-latest
    # A hang is a failure, not hours of waiting.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
      - name: dm
        working-directory: desktop
        # The runner has no graphics driver: GPUI draws through Direct3D 11
        # on Windows' own software adapter (WARP), which needs nothing beside
        # the program (docs/decisions.md, 2026-11-11).
        run: cargo build --release -p dm-gpui --locked
      - name: app-check
        env:
          DM_BINARY: ${{ github.workspace }}\desktop\target\release\dm-gpui.exe
          PYTHONUNBUFFERED: "1"
        run: python scripts/app-check.py
      - name: Out of the box, nothing installed
        # QuickJS, fetched by dm's own code from GitHub, checked, and run
        # on Windows: what dm falls back on where Windows has no engine of
        # its own (YouTube's checks and proxy scripts run in Windows' own).
        working-directory: desktop
        env:
          DM_NETWORK_TESTS: "1"
        run: cargo test -p dm-core --test tools --locked -- --nocapture
