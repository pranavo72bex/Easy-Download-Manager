name: Contract on Windows and macOS

# The behaviour contract's rows (docs/behaviour-contract.md) on GitHub's Windows and macOS
# runners, as a person runs them: `cargo xtask qa` builds dm, packages the extension and runs
# human-qa.py, which drives dm's real window through its own buttons and dialogs (UI Automation
# on Windows, NSAccessibility on macOS) in the runner's desktop session, with Edge for the
# browser rows. Its words are the run's `contract-words-<os>` artifact and its rows the run's
# summary (scripts/human-qa-report.py), as contract-linux.yml's are.
#
# REPORTED, NOT GATING, for everyone, until its rows are known to hold here (the maintainer,
# 2026-11-26: the bots' merge is to be held to these systems too once they are). Then
# scripts/ai-merge.sh reads these words as it reads Linux's (scripts/ai-contract-gate.py:
# every row main holds here must hold with the change). Which rows a runner cannot hold (no
# Screen Recording or Accessibility permission for the runner's programs on macOS, YouTube
# refusing GitHub's servers) its runs on main say.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Every row on ${{ matrix.os }} (reported, not gating)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      # macOS asks a person before a program may drive another's window or picture the screen.
      # A runner has no person: the runner's own programs are let in where macOS lets that be
      # written (best effort; a row that still cannot be seen is reported as not checked).
      - name: Accessibility and Screen Recording for the runner's programs (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for client in "$(command -v python3)" /usr/bin/python3 /bin/bash /usr/local/bin/bash "$(command -v cargo)"; do
              [ -n "$client" ] || continue
              for service in kTCCServiceAccessibility kTCCServiceScreenCapture kTCCServicePostEvent; do
                sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags) VALUES ('$service', '$client', 1, 2, 4, 1, 'UNUSED', 0);" 2>&1 | head -n 2 || true
              done
            done
          done

      - name: Every row, as cargo xtask qa runs them (reported, not gating)
        id: qa
        continue-on-error: true
        timeout-minutes: 150
        shell: pwsh # on Windows not Git Bash, where dm's window is pictured black (xtask refuses it)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          $words = Join-Path $env:RUNNER_TEMP 'human-qa.txt'
          cargo xtask qa 2>&1 | Tee-Object -FilePath $words
          exit $LASTEXITCODE

      - name: Rows held, failed and not checked (reported, not gating)
        if: always()
        shell: bash
        run: |
          python3 scripts/human-qa-report.py "$RUNNER_TEMP/human-qa.txt" --summary "$GITHUB_STEP_SUMMARY" --annotate || true
          echo "cargo xtask qa on ${{ matrix.os }}: ${{ steps.qa.outcome }} (reported, not gating)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: contract-words-${{ matrix.os }}
          path: ${{ runner.temp }}/human-qa.txt
          if-no-files-found: warn
          retention-days: 30
