name: AI fix

# An issue labelled `bot-fix` (or one named by hand) is handed to Gemini CLI on
# Google AI Studio's free tier (the GEMINI_API_KEY secret; the repository
# variable GEMINI_MODEL picks a model, else the CLI's default). The model sees
# only its own key, never a GitHub token, and edits the tree only; this
# workflow checks the change (format, clippy, layering, headers, the whole
# test run) and opens a *draft* pull request. The window's QA
# (scripts/human-qa.py) needs a visible window, so a person runs it before
# marking the pull request ready and merging. Only someone with triage rights
# can add a label, so a stranger's issue never starts this.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to fix'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bot-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false # the model never holds a GitHub token
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # as rust-toolchain.toml
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - name: GPUI's Linux libraries and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: Gemini CLI
        run: npm install -g @google/gemini-cli@0.68.0

      # The issue and, when it names a failed run, that run's log, as files the
      # model reads. The log stays in this job; it is not posted anywhere.
      - name: Gather the issue and the failure
        run: |
          set -euo pipefail
          mkdir -p .bot
          printf '.bot/\n.gemini/\n' >> .git/info/exclude
          gh issue view "$ISSUE" --json title,body,comments > .bot/issue.json
          run_id=$(jq -r '[.body, (.comments[].body)] | join("\n")' .bot/issue.json \
            | grep -oE 'run_id: [0-9]+' | tail -n1 | cut -d' ' -f2 || true)
          if [ -n "${run_id:-}" ]; then
            gh run view "$run_id" --log-failed 2>/dev/null | tail -n 600 > .bot/failure.log || true
          fi
          touch .bot/failure.log
          cat > .bot/prompt.md <<'EOF'
          You are fixing one bug in this repository (a Rust download manager, Cargo workspace at the root, crates in crates/).

          1. Read CLAUDE.md, AGENTS.md and docs/behaviour-contract.md first and follow them.
          2. The issue is in .bot/issue.json. If it came from a failed CI run, the run's failed log is in .bot/failure.log.
          3. Find the root cause by reading the code. Reproduce it with a test where you can (`cargo test -p <crate> <name>`).
          4. Make the smallest change that fixes the root cause, and add or adjust a test that fails without the fix.
          5. Do not change any behaviour listed in docs/behaviour-contract.md, the window's layout, dialogs or wording, and do not edit anything under .github/. Do not weaken, skip or delete a test to make it pass.
          6. Check your work: `cargo fmt --all`, `cargo clippy --workspace --all-targets --locked -- -D warnings`, then the failing crate's tests, then `cargo xtask test --profile ci`.
          7. Do not commit. Write a short summary of the cause and the fix to .bot/summary.md.
          8. If you cannot find or fix the cause, change no source file and write what you found to .bot/summary.md.
          EOF

      # Its tools: read, search, edit, and cargo and read-only git in the
      # shell. It runs with only its key, a home and a path in its environment.
      - name: Ask Gemini for a fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -uo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then echo '::error::The GEMINI_API_KEY secret is not set'; exit 1; fi
          mkdir -p "$HOME/.gemini"
          cat > "$HOME/.gemini/settings.json" <<'EOF'
          { "model": { "maxSessionTurns": 120 },
            "tools": { "core": [ "list_directory", "read_file", "glob", "grep_search", "search_file_content",
              "replace", "write_file", "run_shell_command(cargo)", "run_shell_command(git diff)",
              "run_shell_command(git status)", "run_shell_command(git log)" ] } }
          EOF
          model_args=()
          if [ -n "$GEMINI_MODEL" ]; then model_args=(--model "$GEMINI_MODEL"); fi
          timeout 90m env -i "HOME=$HOME" "PATH=$PATH" TERM=dumb CI=true CARGO_TERM_COLOR=never \
            "GEMINI_API_KEY=$GEMINI_API_KEY" \
            gemini --yolo "${model_args[@]}" --prompt "$(cat .bot/prompt.md)"
          echo "Gemini exited with $?"

      # The model's word is not taken: the change is checked here as CI checks it.
      - name: Check the change
        id: check
        run: |
          set -uo pipefail
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then echo "result=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qE ' (\.github/|docs/behaviour-contract\.md|docs/behaviour-baseline/)' <<<"$changed"; then
            echo "result=forbidden" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cargo fmt --all
          if cargo clippy --workspace --all-targets --locked -- -D warnings \
             && cargo xtask layers && cargo xtask headers \
             && cargo xtask test --profile ci; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a draft pull request
        if: steps.check.outputs.result == 'pass'
        run: |
          set -euo pipefail
          branch="bot/issue-$ISSUE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A -- . ':!.bot'
          git commit -m "Fix #$ISSUE (Gemini, draft)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$branch"
          summary=$(cat .bot/summary.md 2>/dev/null || echo 'No summary written.')
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          body=$(printf 'Fixes #%s\n\n%s\n\nFormat, clippy, layering, headers and `cargo xtask test --profile ci` passed on Linux in the fixer run. Before merging: run `python3 scripts/human-qa.py` in a visible window, and close and reopen this pull request so CI runs on it.\n' "$ISSUE" "$summary")
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr comment "$branch" --body "$body"
          else
            gh pr create --draft --head "$branch" --title "Fix #$ISSUE (Gemini, needs QA)" --body "$body"
          fi

      - name: Say why there is no pull request
        if: always() && steps.check.outputs.result != 'pass'
        env:
          RESULT: ${{ steps.check.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            none) why='Gemini changed no file.' ;;
            forbidden) why='Gemini changed a file it may not (.github/ or the behaviour contract); the change was dropped.' ;;
            fail) why='Gemini made a change, but clippy or the tests failed on it; the change was dropped.' ;;
            *) why='The fixer stopped before checking a change.' ;;
          esac
          summary=$(cat .bot/summary.md 2>/dev/null || true)
          gh issue comment "$ISSUE" --body "$(printf '%s ([run](%s))\n\n%s\n' "$why" "$RUN_URL" "$summary")"
