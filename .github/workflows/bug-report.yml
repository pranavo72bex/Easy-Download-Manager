name: Bug report

# Turns a red run on main into an issue, so no failure goes unread: one open issue per
# workflow (a later failure of the same workflow is a comment on it, not a second issue),
# closed by the workflow's next green run on main. A new issue is queued for the AI fixer
# (labels bot:queue, bot-task:ci; ai-worker.yml starts ai-fix.yml).
#
# And the bots' safety net: when the commit that turned main red is one the bot merged
# (ai-merge.yml) and the run before it was green, that merge is reverted at once, CI and
# Desktop run again on main, and its issue is reopened and queued to be tried again
# (scripts/ai-revert.sh). The same for the contract: a bot's merge after which main holds
# fewer of the behaviour contract's rows than the run before it is reverted too (the
# `contract` job; scripts/ai-contract-gate.py judges). GitHub's free runners and free models
# only; nothing to pay for.
on:
  workflow_run:
    workflows: [CI, Desktop, Deep fuzz, Audit, Contract on Linux]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'A failed run to report (its number in the run URL)'
        required: true

permissions:
  actions: write # starts the worker; CI and Desktop again after a revert
  contents: write # the revert
  issues: write

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.name != 'Contract on Linux'
      && contains(fromJSON('["failure", "success"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
      - name: Open or update the issue, or revert the bot's merge
        run: |
          set -euo pipefail
          for l in bot-fix bot:queue bot-task:ci bot:reverted; do
            gh label create "$l" --color 5319e7 --description "EDM's bot" 2>/dev/null || true
          done

          run_json=$(gh run view "$RUN_ID" --json workflowName,workflowDatabaseId,headSha,url,jobs,conclusion,createdAt)
          workflow=$(jq -r .workflowName <<<"$run_json")
          url=$(jq -r .url <<<"$run_json")
          sha=$(jq -r .headSha <<<"$run_json")
          failed_jobs=$(jq -r '.jobs[] | select(.conclusion == "failure") | "- " + .name' <<<"$run_json")
          title="CI failure on main: $workflow"
          open_issue() {
            gh issue list --state open --label bot-fix --search "\"$title\" in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1
          }

          # Green again: the workflow's open issue, if any, is closed.
          if [ "$(jq -r .conclusion <<<"$run_json")" = success ]; then
            existing=$(open_issue)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "[$workflow]($url) passed on main at $sha: closed."
              gh issue close "$existing" --reason completed
              echo "Closed #$existing"
            fi
            exit 0
          fi

          # The bot's own merge turned main red: undone.
          created=$(jq -r .createdAt <<<"$run_json")
          wid=$(jq -r .workflowDatabaseId <<<"$run_json")
          before=$(gh api "repos/$GH_REPO/actions/workflows/$wid/runs?branch=main&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at < \"$created\" and .conclusion != \"cancelled\")] | first | .conclusion // empty")
          if [ "$before" = success ] && bash scripts/ai-revert.sh "$sha" "$workflow failed" "$url"; then
            exit 0
          fi

          body=$(printf '%s\n\n%s\n\n%s\n%s\n' \
            "[$workflow]($url) failed on main at $sha." \
            "run_id: $RUN_ID" \
            "Failed jobs:" "$failed_jobs")

          existing=$(open_issue)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Commented on #$existing"
          else
            issue_url=$(gh issue create --title "$title" --label bot-fix,bot:queue,bot-task:ci --body "$body")
            echo "Opened ${issue_url##*/}"
            gh workflow run ai-worker.yml || true
          fi

  # A bot's merge after which main holds fewer contract rows than the run before it: undone.
  # The contract run itself always passes (it is reported, not gating, for people), so it is
  # judged by its words, against the last run on main before it.
  contract:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Contract on Linux' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      CREATED: ${{ github.event.workflow_run.created_at }}
      WID: ${{ github.event.workflow_run.workflow_id }}
      URL: ${{ github.event.workflow_run.html_url }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
      - name: Revert the bot's merge if main holds fewer rows
        run: |
          set +e -uo pipefail # each failure here is read, not fatal
          git log -1 --format=%B "$SHA" 2>/dev/null | grep -q 'Merged by ai-merge.yml' || { echo "Not the bot's merge."; exit 0; }
          # Held to the rows each of main's three runs before it held (a flaky row is not one).
          mkdir -p .bot
          before=()
          for id in $(gh api "repos/$GH_REPO/actions/workflows/$WID/runs?branch=main&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at < \"$CREATED\" and .conclusion == \"success\")][:3] | .[].id"); do
            bash scripts/ai-contract-words.sh "$id" ".bot/before-$id.txt" && before+=(".bot/before-$id.txt")
          done
          [ "${#before[@]}" -gt 0 ] || { echo "No run on main before it left words to hold it to."; exit 0; }
          bash scripts/ai-contract-words.sh "$RUN_ID" .bot/after.txt || { echo "This run left no words: nothing to judge."; exit 0; }
          python3 -I scripts/ai-contract-gate.py .bot/after.txt "${before[@]}" | tee .bot/gate.txt
          verdict=${PIPESTATUS[0]}
          [ "$verdict" = 1 ] || exit 0
          # Seen once, run again before anything is undone: reverted only when the rows are
          # lost a second time.
          if [ "${ATTEMPT:-1}" -lt 2 ]; then
            echo "Fewer rows held after the bot's merge: the run goes again before it is reverted."
            gh run rerun "$RUN_ID"
            exit 0
          fi
          bash scripts/ai-revert.sh "$SHA" "the contract held fewer rows, twice ($(grep -oE '^- B[0-9]+' .bot/gate.txt | cut -c3- | paste -sd, -))" "$URL" || true
