# Weekly pull requests for out-of-date dependencies. The actions are pinned
# to commit SHAs, and this is what moves those pins forward.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /browser
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
