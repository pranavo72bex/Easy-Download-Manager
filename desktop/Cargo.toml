# The engine is its own crate, deliberately.
#
# It is the product: everything a download manager is judged on — many connections, resume,
# throughput — lives here, and none of it needs a window. Keeping it free of
# the GUI means it can be tested against real servers in milliseconds rather
# than driven through a webview, and the shell becomes a thin thing on top
# rather than the place the logic hides.
[workspace]
resolver = "2"
members = ["crates/dm-core", "crates/dm-protocol", "crates/dm-shell", "crates/dm-desktop-base", "crates/dm-desktop", "crates/dm-gpui", "xtask"]
# A patched copy, used through [patch.crates-io], not a member.
exclude = ["vendor/winit", "vendor/egui-winit", "vendor/librqbit", "vendor/eframe", "vendor/gpui-pre-linux", "vendor/gpui-pre-windows"]

# The lints every dm crate keeps, in one place rather than pasted into each crate's root
# (gaps row A1); each crate's `[lints] workspace = true` takes them. Clippy refuses warnings in
# CI (`cargo clippy -- -D warnings`), so these hold.
[workspace.lints.rust]
# Every public item says what it is for (gaps row 27).
missing_docs = "warn"

[workspace.lints.clippy]
# From Google's Rust style guide: an `unsafe` block says why it is sound (`// SAFETY:`, on every
# platform, Windows included), a string is built with `format!` rather than `+`, and a loop is a
# loop rather than `for_each`.
undocumented_unsafe_blocks = "warn"
string_add = "warn"
needless_for_each = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Built for speed where the work is the CPU's: dm's engine with its MP3, GIF
# and resampling code ("z" made it three times as slow), digests, unpacking,
# TLS, AAC decoding and drawing. The rest waits on the network or the window
# and is built for size. Not dm-gpui or dm-desktop: with LTO a binary's
# setting becomes the whole program's (dm-desktop at 3 was 27 MB).
# docs/decisions.md, 2026-11-06 and 2026-11-12 (gaps row S12).
[profile.release.package.dm-core]
opt-level = 3
[profile.release.package.symphonia-codec-aac]
opt-level = 3
[profile.release.package.symphonia-core]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
# The HTTP stack every byte of a download passes through: the connection's
# reading (hyper), the runtime that wakes for each piece (tokio) and TLS's
# records (rustls). At 3 a 512 MiB download over plain HTTP took 5 % fewer
# instructions and 10 % less CPU for 329 KB of binary; rustls's share is not
# measured yet (gaps row S12).
[profile.release.package.hyper]
opt-level = 3
[profile.release.package.tokio]
opt-level = 3
[profile.release.package.rustls]
opt-level = 3
# The shipped window's drawing: GPUI's frame (gpui-pre), its layout (taffy)
# and each system's window, renderer and text. On macOS the window is
# gpui-pre-macos and the Metal renderer and the text are gpui-pre-apple; on
# Linux the window is gpui-pre-linux and the renderer and text gpui-pre-wgpu;
# on Windows all three are gpui-pre-windows. Not gpui-component or GPUI's
# small helper crates (sum-tree and the like): the 2026-11-11 trial that had
# them grew the binary 11 % for nothing measured.
[profile.release.package.gpui-pre]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3
[profile.release.package.gpui-pre-macos]
opt-level = 3
[profile.release.package.gpui-pre-apple]
opt-level = 3
[profile.release.package.gpui-pre-linux]
opt-level = 3
[profile.release.package.gpui-pre-wgpu]
opt-level = 3
[profile.release.package.gpui-pre-windows]
opt-level = 3
# The egui window's drawing, only while that window is still built (gaps G9):
# they go with it. dm-gpui's build has neither crate.
[profile.release.package.epaint]
opt-level = 3
[profile.release.package.egui]
opt-level = 3

# The release build with its symbols and line tables kept, for a profiler
# (docs/testing.md, Profiling): `cargo build --profile profiling -p dm-gpui`.
# The same code as the release (line tables do not change it: stripped, it was
# within 1.2 KB of the release binary on macOS), built about a fifth slower.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = false

# Crates built with a change of dm's own (desktop/vendor/README.md).
[patch.crates-io]
winit = { path = "vendor/winit" }
egui-winit = { path = "vendor/egui-winit" }
eframe = { path = "vendor/eframe" }
librqbit = { path = "vendor/librqbit" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
