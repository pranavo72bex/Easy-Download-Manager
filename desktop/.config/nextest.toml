# cargo nextest: each test in a process of its own, test binaries side by
# side. The `ci` profile is what .github/workflows/desktop.yml runs.
[profile.ci]
# Every failure reported, not only the first: a run is minutes of compute.
fail-fast = false
# A test silent for 60 s is reported slow; at 5 minutes it is a hang, and
# killed, rather than holding the runner until its job times out.
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"
# A test that fails fails: no test is tried again unless it is named below
# (gaps row A1; before, every test was retried twice in silence).
retries = 0

# A report of every test, so a failure is named where anyone can read it: the
# run's log is open to the repository's administrators only, and its
# annotations to everyone (`scripts/ci-failed-tests.py`).
[profile.ci.junit]
path = "junit.xml"

# Tried again, and reported as flaky (scripts/ci-failed-tests.py names each in
# the run's annotations, passing run or not), only these:
#
# The outage's turns, timed to the tenth of a second on a starved runtime
# (docs/gaps.md row 195, open until ten whole runs in a row pass).
[[profile.ci.overrides]]
filter = "package(dm-core) & test(connections_that_lose_the_server_take_turns_and_come_back_together)"
retries = 2
