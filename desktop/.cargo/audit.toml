# `cargo audit` reads this. Each advisory ignored here was looked at and is
# unreachable in dm; the reason is beside it, and the line goes when the
# crate is upgraded past it.
[advisories]
ignore = [
    # ringbuf 0.4 (through librqbit-utp): a double free when an element's
    # Drop panics in skip/clear. librqbit-utp's ring holds u8, which has no
    # Drop. The fix is ringbuf 0.5, which librqbit has not moved to yet.
    "RUSTSEC-2026-0293",
    # zbus_names, zvariant and zvariant_derive "unmaintained": not a fault in
    # them, but merged into zbus 6. dm reaches them through zbus 5, which
    # GPUI's screen-reader support on Linux (accesskit_unix), the Linux tray
    # and the notifications are all built on; the line goes when they move to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # paste "unmaintained" (through rav1d, the AV1 decoder of a Linux GIF, gaps
    # row 54): a macro that joins names while rav1d is compiled, so none of it is
    # in dm's binary, and no fault is known in it. The line goes when rav1d
    # moves off it.
    "RUSTSEC-2024-0436",
    # "Unmaintained" (2026-11-13), none a known fault, all deep in the GPUI window toolkit
    # with no GPUI release past them yet; each line goes when GPUI moves off its crate:
    # instant (gpui-base, gpui-component: a timer shim; std's Instant on every system dm
    # builds for), rustls-pemfile (gpui-pre-reqwest, reading PEM files GPUI's assets do not
    # use), rustybuzz and ttf-parser (usvg and fontdb, drawing GPUI's own SVG icons, which
    # are dm's own files, never a site's).
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]
