[package]
name = "dm-desktop"
version = "0.5.0"
authors = ["pranavo72bex <pranavj304@gmail.com>"]
license = "MIT"
edition = "2021"
description = "dm — a download manager, with a window drawn in Rust"

# The window, in Rust: egui on winit,
# no web view. Everything that is not the window is dm-shell's and dm-core's.
# The binary keeps the name the installer, the browser's native host
# manifest, the Makefile and the PKGBUILD already use.
[[bin]]
name = "dm-desktop"
path = "src/main.rs"

[lib]
name = "dm_desktop"
path = "src/lib.rs"

[dependencies]
# The window's native handle, for the drag and drop the window system does
# outside winit (drops.rs, and dragging files out).
raw-window-handle = "0.6"
# The computer's fonts for other scripts, mapped rather than read: a CJK
# collection is 20 MB, of which a window draws a few glyphs.
memmap2 = "0.9"
dm-core = { path = "../dm-core" }
dm-shell = { path = "../dm-shell" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "accesskit", "clipboard"] }
# The emoji fonts 0.36 bundled (◀ ▶ and the like in menus and buttons),
# which 0.37 left out of its default fonts.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# A login launch's event loop, which makes the window only when it is first
# shown (`run_hidden` in main.rs). The version eframe runs on.
winit = { version = "0.30", default-features = false }
# Arabic and Hebrew names put into the order they are read, which egui's
# text layout does not do (src/bidi.rs).
unicode-bidi = "0.3"
# The download list: a sortable, resizable table.
egui_extras = { version = "0.37", features = ["serde"] }
# `signal`: a logout or `kill` quits dm as Program › Exit does.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "signal"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# What Tauri's plugins did, each from the crate they wrapped.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
auto-launch = "0.6"
notify-rust = "4"
arboard = "3"
# The control protocol's token.
getrandom = "0.4"
# Import and Export's file choosers.
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
# The system's language, for the window's first one: from the OS itself,
# since an app opened from the Dock or a login item has no LANG.
sys-locale = "0.3"

# Dragging a finished file out of the window, into Finder, Explorer, a mail
# or a chat. It starts the drag from the window's native handle, which it
# can do on macOS and Windows; on Linux it needs a GTK window, and dm's is
# not one.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1"

# The Dock icon's click, which winit leaves to an application delegate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSWorkspace and NSAccessibility: whether the system asks for less motion;
# NSColor and NSColorSpace: its accent colour (accent.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSAccessibility", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
# The pasteboard's strings, for a link dragged in from a browser (drops.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

# AttachConsole, so `--register` and `--unregister` print to the terminal
# that ran them; SetSuspendState for Sleep; RegGetValueW
# for the login item, read as UTF-16; MessageBeep for the
# sounds. Already in the tree through dm-core.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # The title bar dark, and in the window's colour (chrome.rs).
  "Win32_Graphics_Dwm",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Power",
  # A wake timer for the schedule (wake.rs).
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  # dm's own drop target, for a link dragged from a browser (drops.rs).
  # STGMEDIUM is behind Gdi as well as StructuredStorage: named here rather
  # than left to another crate in the tree to switch on.
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
# Dragging finished files out of the window on X11 (xdnd.rs): a connection
# of dm's own speaking XDND as the drag's source, and winit's own display,
# to let go of the pointer it holds. Both already in the tree through winit.
x11rb = { version = "0.13", default-features = false }
x11-dl = "2.19"

# The Windows program's icon and version information (build.rs), which
# Explorer, SmartScreen and a code signature read.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
proptest = "1"
dm-protocol = { path = "../dm-protocol" }
# The window driven the way a person drives it, through its accessibility
# tree, and rendered offscreen for a picture of what it draws.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile = "3"
# The digest a test works out for itself, to hold the window's to.
sha2 = "0.11.0"
hex = "0.4.3"
# A real archive for the extraction test.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The window's memory written out as eframe writes it, for a relaunch.
ron = "0.12"
axum = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }

# The installers: `cargo packager --release` from this directory.
# What `cargo tauri build` made, without Tauri: a .app and .dmg on macOS, a
# .deb and an AppImage on Linux, an NSIS installer on Windows. The update
# check reads the release's own latest.json, so nothing here signs one.
[package.metadata.packager]
productName = "dm"
identifier = "com.dm.desktop"
description = "Multi-connection downloads that resume"
longDescription = "dm splits a file across several connections, resumes what was interrupted, and takes over the downloads you start in a browser."
category = "Utility"
beforePackagingCommand = "cargo build --release -p dm-desktop"
outDir = "../../target/release/bundle"
binaries = [{ path = "dm-desktop", main = true }]
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"
# Ad-hoc: the whole bundle signed with no certificate ("-"). Unsigned as a
# bundle (only the linker's signature on the binary), a downloaded dm.app
# was "damaged and can't be opened" on Apple silicon, with only Move to Bin
# on offer; signed ad hoc it gets the ordinary "cannot verify" prompt, which
# System Settings › Privacy & Security lets a person open anyway. A real
# Developer ID, when there is one, replaces "-" (docs/RELEASING.md).
signingIdentity = "-"

# What the binary loads at run time on Linux, none of it linked, so the
# package must name it: the X11 libraries winit opens before any window
# (X11, Xcursor, X11-xcb, Xi), its Wayland ones, xkbcommon, and GL. GTK
# used to bring the X11 ones along; without it a system lacking them could
# not open the window ("Failed to load one of xlib's shared libraries").
[package.metadata.packager.deb]
# dm's own entry rather than the one generated from the binary's name: the
# window's app id is "dm", and a launcher without StartupWMClass=dm is not
# matched to its window on Wayland (a second, generic icon in the dock).
# It also makes dm the handler for magnet links.
desktopTemplate = "../../packaging/deb.desktop"
depends = [
  "libx11-6",
  "libxcursor1",
  "libx11-xcb1",
  "libxi6",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libwayland-egl1",
  "libegl1",
  "libgl1",
  # Open and Open folder go through xdg-open (dm-shell/src/shell.rs).
  "xdg-utils",
]

# The uninstaller tells the browsers dm is going and removes its login item
# before the files go: `--unregister`, as the README asks a person to run
# by hand elsewhere. An uninstaller section ("un.") placed here comes before
# the template's own `Section Uninstall`, so it runs first. Upgrading through
# "uninstall first" runs it too; the next launch writes both back
# (`register::ensure_this_copy`, the login item following the setting).
[package.metadata.packager.nsis]
preinstallSection = """
Section "un.dmUnregister"
  ExecWait '"$INSTDIR\\${MAINBINARYNAME}.exe" --unregister'
SectionEnd
"""
