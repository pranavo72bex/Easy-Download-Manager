[package]
name = "dm-shell"
version = "0.10.0"
license = "GPL-3.0-or-later"
edition = "2021"
# Never published: its paths to the other crates are this repository's
# (desktop/deny.toml).
publish = false
description = "What every dm window shares: the settings, the browser host, the one-instance lock, startup and the inbox"

# No window toolkit here. The window (dm-gpui) and the headless mode both sit
# on this, so what a download manager does at startup, on a browser hand-off
# and on a settings change is written once, with a window drawing it or none.
[dependencies]
# A form's raw body, which the extension sends as base64 (dm-core's version).
base64.workspace = true
dm-core.workspace = true
dm-protocol.workspace = true
# Its files that are not code: desktop/assets/ (gaps row X9).
dm-assets.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# The update manifest's Ed25519 signature (gaps row F6); already rustls's provider.
ring.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "net"] }
url.workspace = true
# Reading a crawled page no further than its cap.
futures-util.workspace = true

# Whether a mount is read-only (a disk image), for `register::transient`.
# Already in the tree through tokio.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The logins and secrets tests use (gaps row X10).
dm-test-support.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
axum.workspace = true
# The benches (benches/), run by hand and never in CI (gaps row 190).
criterion.workspace = true

# Run by hand (`cargo bench -p dm-shell --bench large_list`), never by `cargo test` or CI:
# criterion's own main, not the test harness (docs/testing.md, Benchmarks; gaps row 190).
[[bench]]
name = "large_list"
harness = false

# A browser's pipes to the native host, kept from the dm it starts
# (`host::launch_desktop`): inherited, they held the host's answer open.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  # A dial-up or VPN connection dialled before downloads (platform/dialup/ras.rs); a
  # connection's status names its tunnel's addresses, which WinSock defines.
  "Win32_NetworkManagement_Rras",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  # A long path's short form for Explorer and the Recycle Bin (`shell::for_shell`).
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  # Browsers' hosts, magnet links and the firewall's rules, written and read
  # without reg.exe (registry.rs).
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[lints]
workspace = true
