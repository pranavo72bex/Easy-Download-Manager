[package]
name = "dm-shell"
version = "0.9.0"
license = "GPL-3.0-or-later"
edition = "2021"
# Never published: its paths to the other crates are this repository's
# (desktop/deny.toml).
publish = false
description = "What every dm window shares: the settings, the browser host, the one-instance lock, startup and the inbox"

# No window toolkit here. The Tauri window and the egui one both sit on this,
# so what a download manager does at startup, on a browser hand-off and on a
# settings change is written once, whichever window is drawing it.
[dependencies]
# A form's raw body, which the extension sends as base64 (dm-core's version).
base64 = "0.22"
dm-core = { path = "../dm-core" }
dm-protocol = { path = "../dm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "sync", "net"] }
dirs = "7.0.0"
url = "2"
# Reading a crawled page no further than its cap.
futures-util = "0.3"

# Whether a mount is read-only (a disk image), for `register::transient`.
# Already in the tree through tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
axum = "0.8"

# A browser's pipes to the native host, kept from the dm it starts
# (`host::launch_desktop`): inherited, they held the host's answer open.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # A dial-up or VPN connection dialled before downloads (dialup/ras.rs); a
  # connection's status names its tunnel's addresses, which WinSock defines.
  "Win32_NetworkManagement_Rras",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  # A long path's short form for Explorer and the Recycle Bin (`shell::for_shell`).
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[lints]
workspace = true
