[package]
name = "dm-core"
version = "0.8.6"
license = "MIT"
edition = "2021"

[dependencies]
# Already in the tree through reqwest; named for its chunk type.
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "net"] }
# rustls rather than the system OpenSSL: a download manager that fails to
# build on a machine without libssl headers is one nobody can package.
# `socks`, or a SOCKS proxy in the settings failed every HTTP download with
# "unsupported scheme".
# 0.13, as the torrent library has it, so one reqwest is built; its TLS is
# handed the same rustls set-up as the stream protocols (`tls_backend`):
# ring and the public roots, as 0.12's `rustls-tls` had it.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy", "socks"] }
# FTP through a SOCKS proxy: the handshake, after which the connection is a
# plain one. HTTP CONNECT is a few lines and is written here.
tokio-socks = "0.5"
# rtmps:// streams (rtmp.rs): TLS as reqwest has it, with the same roots.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# rtsp:// streams (rtsp.rs): RTSP, RTP and the H.264, H.265 and AAC
# depacketizers, which every camera and media server speaks.
retina = "0.4"
# The `Proxy-Authorization` an HTTP CONNECT to a proxy with a login carries.
base64 = "0.22"
futures-util = "0.3"
thiserror = "2"
# The shell sends these straight into a webview; deriving here beats
# maintaining a parallel set of near-identical types in the GUI crate.
serde = { version = "1", features = ["derive"] }
# The queue is written to disk so a restart does not lose it.
serde_json = "1"
# Already in the tree via reqwest's url dependency; named so the hand-rolled
# byte-scanner it replaces cannot come back.
percent-encoding = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.11.0"
md-5 = "0.11.0"
# NTLM sign-ins (`ntlm.rs`): its NT hash is MD4 of the password, and its
# client challenge must be unpredictable.
md4 = "0.11"
getrandom = "0.4"
hex = "0.4.3"
quick-xml = "0.42.0"
url = "2.5.8"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["block-padding", "alloc"] }
# BitTorrent, the one kind of download the browser side cannot do at all: an
# extension has no sockets. rustls to match reqwest above, so the binary
# carries one TLS stack rather than two.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
tokio-util = "0.7"
dirs = "7.0.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

# A body a server compresses unasked is undone here and not by reqwest, which
# gives no count of the bytes on the wire: with it the expansion is held to a
# ratio (`decode.rs`), as a decompression bomb needs.
flate2 = "1"
brotli-decompressor = "5"

# `killpg`, to end yt-dlp's process group without running a `kill` program
# that a minimal `PATH` may not find. Already in the tree through tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The free space on a disk, so a file too large for it is refused at the
# start. Already in the tree through tokio and others; only its
# file-system module is named.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Random and hostile input for the readers of outside data (tests/fuzz.rs),
# on stable Rust inside cargo test.
proptest = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rand = "0.8"
# Cleans up after itself. The hand-rolled version left a directory of
# downloaded parts behind on every run.
tempfile = "3"
sha2 = "0.11.0"
hex = "0.4.3"
memory-stats = "1.2.0"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["block-padding", "alloc"] }
# A certificate for the rtsps:// bridge's test server.
rcgen = "0.14"

# Used as `md5` (checksums and Digest sign-ins), which the name `md-5` hides
# from cargo-machete.
[package.metadata.cargo-machete]
ignored = ["md-5"]
