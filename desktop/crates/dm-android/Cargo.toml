[package]
name = "dm-android"
version = "0.10.0"
authors = ["pranavo72bex"]
license = "GPL-3.0-or-later"
edition = "2021"
# Never published: its paths to the other crates are this repository's
# (desktop/deny.toml).
publish = false
description = "dm on Android, all in Rust: dm-gpui's own window on gpui-android, with the phone's services (notifications, opening a file, the clipboard, the wake lock, a share) reached through JNI (gaps rows N1, N3, N5, N6, N16)"

[lib]
name = "dm_android"
path = "src/lib.rs"
# `cdylib` is the `libdm_android.so` the APK carries (android/, docs/android.md), whose
# `android_main` the activity starts; `lib` is for the host's checks and tests.
crate-type = ["cdylib", "lib"]

[dependencies]
# A sealed secret's file: the Keystore's IV and ciphertext as text (`sealed.rs`, gaps row N11).
base64.workspace = true
dm-core.workspace = true
# The seam the phone's services are handed to (`dm_desktop_base::phone`, gaps row N17).
dm-desktop-base.workspace = true

# On the phone: dm-gpui's window (the desktop's own, gaps row N17) on GPUI's Android platform
# (dm's copy of gpui-mobile's, gaps row N16), the NativeActivity glue it runs on, and JNI for
# what only Android has (the shared link, notifications, the wake lock, the clipboard).
[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
dm-gpui.workspace = true
# The running dm's inbox, which a notification's Retry and Stop All are left in (gaps row N6).
dm-shell.workspace = true
gpui.workspace = true
gpui-android.workspace = true
jni.workspace = true

# The host's tests of the sealed secrets' files and of where a finished file goes (`sealed.rs`,
# `storage.rs`) work in folders of their own.
[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
