[package]
name = "dm-protocol"
version = "0.8.4"
license = "MIT"
edition = "2021"
description = "What the browser extension and the desktop app say to each other, written once for both"

# Used by the native host in dm-shell and by the extension, which is built
# for wasm32-unknown-unknown — so nothing here may need an operating system:
# no files, no clocks, no threads. serde and nothing else.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
# Only to check that the key in extension/manifest.json still yields the id
# named here, the way Chrome derives it.
sha2 = "0.11.0"
