[package]
name = "dm-desktop-base"
version = "0.9.0"
authors = ["pranavo72bex"]
license = "GPL-3.0-or-later"
edition = "2021"
description = "dm — what the desktop program does that is not drawing: the system's services, the control port, the command line"

# Everything of the desktop program that no window toolkit draws, so that a
# second window (docs/migration/GPUI_MIGRATION_PLAN.md) can use it without
# depending on the egui one. `cargo xtask layers` forbids it every window
# crate.
[lib]
name = "dm_desktop_base"
path = "src/lib.rs"

[dependencies]
dm-core = { path = "../dm-core" }
dm-shell = { path = "../dm-shell" }
serde_json = "1"
# The control protocol's token (control.rs).
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# A finished download's toast (toast.rs): WinRT, which windows-sys has no
# wrappers for. Already in the tree through other crates.
windows = { version = "0.62", features = [
  "Foundation",
  "Data_Xml_Dom",
  "UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
  # The login item's Run key, read as UTF-16 (autostart.rs).
  "Win32_Foundation",
  "Win32_System_Registry",
  # Sleep and hibernate (power.rs), and keeping the computer awake
  # (awake.rs).
  "Win32_System_Power",
  # The sounds: MessageBeep, and a sound file of the person's own
  # (power.rs).
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  # A wake timer for the schedule (wake.rs).
  "Win32_System_Threading",
  # Whether the person is busy: fullscreen, a game, Focus Assist (quiet.rs).
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
