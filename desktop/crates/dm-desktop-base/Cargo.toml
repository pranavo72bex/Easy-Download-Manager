[package]
name = "dm-desktop-base"
version = "0.9.0"
authors = ["pranavo72bex"]
license = "GPL-3.0-or-later"
edition = "2021"
description = "dm — what the desktop program does that is not drawing: the system's services, the control port, the command line"

# Everything of the desktop program that no window toolkit draws, so that a
# second window (docs/migration/GPUI_MIGRATION_PLAN.md) can use it without
# depending on the egui one. `cargo xtask layers` forbids it every window
# crate.
[lib]
name = "dm_desktop_base"
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  # Whether the person is busy: fullscreen, a game, Focus Assist (quiet.rs).
  "Win32_UI_Shell",
] }
