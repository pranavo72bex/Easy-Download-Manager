<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dm</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #242424; --weak: #616161;
          --line: #e0e0e0; --brand: #0f6cbd; --brand-hover: #115ea3; --on-brand: #ffffff; --bad: #c50f1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #292929; --text: #ffffff; --weak: #adadad; --line: #3d3d3d;
            --brand: #115ea3; --brand-hover: #0f6cbd; --bad: #f1707b; }
  }
  body { margin: 0; width: 290px; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; font-size: 15px; }
  .mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px;
          background: var(--brand); color: var(--on-brand); font-size: 14px; }
  .status { margin: 0 14px 10px; color: var(--weak); font-size: 12px; }
  .status.bad { color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .row input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
  .row.off { color: var(--weak); cursor: default; }
  .actions { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  button { width: 100%; padding: 7px 12px; border: 0; border-radius: 4px; background: var(--brand);
           color: var(--on-brand); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover, a.button:hover { background: var(--brand-hover); }
  a.button { display: block; box-sizing: border-box; width: 100%; padding: 7px 12px; border-radius: 4px; background: var(--brand);
             color: var(--on-brand); font-weight: 600; text-align: center; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true">&#8595;</span>dm</header>
<p id="status" class="status" role="status">Looking for the dm app…</p>
<label class="row"><input type="checkbox" id="catching" checked><span>Catch downloads</span></label>
<label class="row" id="panel-row"><input type="checkbox" id="panel" checked><span id="panel-label">Show “Download video” on this site</span></label>
<label class="row" id="catchall-row"><input type="checkbox" id="catchall"><span id="catchall-label">Take every download from this site</span></label>
<label class="row" id="paused-row"><input type="checkbox" id="paused"><span id="paused-label">Pause capturing on this site</span></label>
<label class="row" id="cookies-row"><input type="checkbox" id="cookies"><span id="cookies-label">Hand over this site's sign-in with its downloads</span></label>
<div class="actions" id="open-actions"><button id="open" type="button">Open dm</button></div>
<div class="actions" id="get-actions" hidden><a class="button" id="get-app" target="_blank" rel="noopener" href="https://github.com/pranavo72bex/Easy-Download-Manager/releases/latest">Get the dm app</a></div>
<script type="module" src="popup.js"></script>
</body>
</html>
