<html lang="en">
<head>
<meta charset="utf-8">
<title>dm</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #242424; --weak: #616161;
          --line: #e0e0e0; --brand: #0f6cbd; --brand-hover: #115ea3; --on-brand: #ffffff; --bad: #c50f1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #292929; --text: #ffffff; --weak: #adadad; --line: #3d3d3d;
            --brand: #115ea3; --brand-hover: #0f6cbd; --bad: #f1707b; }
  }
  body { margin: 0; width: 290px; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; font-size: 15px; }
  .mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px;
          background: var(--brand); color: var(--on-brand); font-size: 14px; }
  .status { margin: 0 14px 10px; color: var(--weak); font-size: 12px; }
  .status.bad { color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .row input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
  .row.off { color: var(--weak); cursor: default; }
  .actions { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  button { width: 100%; padding: 7px 12px; border: 0; border-radius: 4px; background: var(--brand);
           color: var(--on-brand); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover, a.button:hover { background: var(--brand-hover); }
  a.button { display: block; box-sizing: border-box; width: 100%; padding: 7px 12px; border-radius: 4px; background: var(--brand);
             color: var(--on-brand); font-weight: 600; text-align: center; text-decoration: none; }
  .steps { margin: 0 14px 10px; padding: 0; list-style: none; font-size: 12px; }
  .steps li { margin: 0 0 6px; }
  .going { margin: 0 14px 10px; padding: 0; list-style: none; font-size: 12px; }
  .going li { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; }
  .going .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .heading { display: flex; align-items: center; gap: 6px; margin: 0 14px 4px; color: var(--weak); font-size: 12px; font-weight: 600; }
  .heading span { flex: 1; }
  button.small { flex: none; width: auto; padding: 1px 7px; border: 1px solid var(--line); background: transparent;
                 color: var(--brand); font-size: 11px; font-weight: 600; }
  button.small:hover { background: var(--line); }
  .advanced { margin: 0 14px 10px; color: var(--weak); font-size: 11px; user-select: all; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true">&#8595;</span>dm</header>
<p id="status" class="status" role="status" data-i18n="popupLooking">Looking for the dm app…</p>
<ul class="going" id="going" aria-live="polite" hidden></ul>
<p class="status bad" id="failed" hidden></p>
<div class="heading" id="recent-head" hidden><span data-i18n="popupRecent">Recent</span><button class="small" id="clear" type="button" data-i18n="popupClearFinished" hidden>Clear finished</button></div>
<ul class="going" id="recent" hidden></ul>
<ol class="steps" id="steps" hidden>
  <li data-i18n="popupStepGet">1. No dm app on this computer yet? Get it, install it and open it once.</li>
  <li data-i18n="popupStepOpen">2. Already installed? Open dm (if it's already open, open it again). This popup connects by itself.</li>
</ol>
<p class="advanced" id="advanced" hidden></p>
<label class="row"><input type="checkbox" id="catching" checked><span data-i18n="popupCatch">Catch downloads</span></label>
<label class="row" id="panel-row"><input type="checkbox" id="panel" checked><span id="panel-label" data-i18n="popupPanelHere">Show “Download video” on this site</span></label>
<label class="row" id="catchall-row"><input type="checkbox" id="catchall"><span id="catchall-label" data-i18n="popupCatchAllHere">Take every download from this site</span></label>
<label class="row" id="paused-row"><input type="checkbox" id="paused"><span id="paused-label" data-i18n="popupPausedHere">Pause capturing on this site</span></label>
<label class="row" id="cookies-row"><input type="checkbox" id="cookies"><span id="cookies-label" data-i18n="popupCookiesHere">Hand over this site's sign-in with its downloads</span></label>
<div class="actions" id="open-actions"><button id="open" type="button" data-i18n="popupOpen">Open dm</button></div>
<div class="actions" id="get-actions" hidden><a class="button" id="get-app" target="_blank" rel="noopener" href="https://github.com/pranavo72bex/Easy-Download-Manager/releases/latest" data-i18n="popupGetApp">Get the dm app</a></div>
<script type="module" src="pkg/popup.js"></script>
</body>
</html>
