[package]
name = "dm-catcher"
version = "3.0.2"
license = "MIT"
edition = "2021"
description = "dm's browser extension: catches downloads and hands them to the app"
publish = false

# Its own workspace, apart from desktop/: it is built for
# wasm32-unknown-unknown, and nothing the desktop links needs to know.
[workspace]

[lib]
# cdylib is the WebAssembly the browser loads; rlib lets `cargo test` run the
# deciding parts on the machine building it.
crate-type = ["cdylib", "rlib"]

[dependencies]
dm-protocol = { path = "../desktop/crates/dm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the browser build talks to a browser. Pinned exactly, because the
# wasm-bindgen CLI that turns the build into what the loader imports must be
# the same version, and scripts/package.sh checks it against Cargo.lock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
# The page script's DOM: the panel over a player.
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlMediaElement", "Node",
  "NodeList", "Selection", "console",
  "EventTarget", "Event", "MouseEvent", "KeyboardEvent", "DomRect", "CssStyleDeclaration",
  "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "DocumentFragment", "Location",
  # The toolbar popup's switches.
  "HtmlInputElement",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The decisions fed random and hostile input on the host (tests/fuzz.rs).
[dev-dependencies]
proptest = "1"
