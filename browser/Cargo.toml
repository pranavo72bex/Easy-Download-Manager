[package]
name = "dm-catcher"
version = "3.5.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "dm's browser extension: catches downloads and hands them to the app"
publish = false
# A member of the one workspace, rooted in desktop/ (gaps row A15): its lock file, target folder,
# dependency versions and the `extension` profile it is built with are there.
workspace = "../desktop"

[lib]
# cdylib is the WebAssembly the browser loads; rlib lets `cargo test` run the
# deciding parts on the machine building it.
crate-type = ["cdylib", "rlib"]

[dependencies]
dm-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
# Keys in the order a page wrote them: a player answer lists its streams that way.
serde_json = { workspace = true, features = ["preserve_order"] }

# Only the browser build talks to a browser. wasm-bindgen is pinned exactly in the workspace
# (the CLI scripts/package.sh runs must be the same version).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
futures-channel.workspace = true
# std and the async-await macro: futures-util's default set, as the desktop's crates take it.
futures-util.workspace = true
# The page script's DOM: the panel over a player.
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlMediaElement", "Node",
  "NodeList", "Selection", "console",
  "EventTarget", "Event", "MouseEvent", "KeyboardEvent", "DomRect", "CssStyleDeclaration",
  "ResizeObserver",
  "ShadowRoot", "ShadowRootInit", "ShadowRootMode", "DocumentFragment", "Location", "MessageEvent",
  # The toolbar popup's switches.
  "HtmlInputElement",
] }

# The decisions fed random and hostile input on the host (tests/fuzz.rs).
[dev-dependencies]
proptest.workspace = true
