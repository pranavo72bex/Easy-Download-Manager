[package]
name = "xtask"
version = "0.10.2"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false
description = "dm's own checks: the scorecard, the layering of the crates, and that nothing phones home"

[dependencies]
toml.workspace = true
# `update-key` and `sign-manifest`: the update manifest's Ed25519 key and signature (gaps row F6).
ring.workspace = true
base64.workspace = true
# `crates-list`: what a release is built from, read from `cargo metadata` (gaps row W21).
serde_json.workspace = true

[dev-dependencies]
# The logins and secrets tests use (gaps row X10).
dm-test-support.workspace = true
