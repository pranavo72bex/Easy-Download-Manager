# `cargo xtask <job>`: the project's own checks, from the repository's root,
# the one workspace (gaps row X4).
[alias]
xtask = "run --quiet -p xtask --"

# The C runtime linked into the Windows binary rather than loaded from
# VCRUNTIME140.dll, which a clean Windows does not have and the installer
# does not bring: without it EDM would not start there at all. The same on
# Windows on Arm (gaps row R3), whose installer brings no runtime either.
# Control Flow Guard (gaps row H13): an indirect call may only land where a function begins;
# Rust leaves it off unless asked, and `cargo xtask hardening-check` fails a binary without it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]
