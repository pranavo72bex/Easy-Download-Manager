# `cargo xtask <job>` from the repository's root as well as from desktop/,
# whose own .cargo/config.toml says the same for that folder (gaps row X4):
# `cargo xtask package` makes this system's installers from here.
[alias]
xtask = "run --quiet --manifest-path desktop/Cargo.toml -p xtask --"
