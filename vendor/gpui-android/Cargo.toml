# gpui-android: GPUI's Android platform, from gpui-mobile
# (https://github.com/itsbalamurali/gpui-mobile, commit
# 5fd54f4554263ae06753e90472c7f2e2ff5d7495, 2026-10-23), which dm takes under
# GPL-3.0-or-later, one of the three licences it offers (LICENSE-GPL; the
# other two are kept beside it). Its Android platform alone: the iOS
# platform, the components, the packages, the platform views, the example and
# the no-op feature flags are removed (`cargo xtask vendor gpui-android`).
# dm's changes are marked `dm(<tag>):`, each tag a row of the table in
# desktop/vendor/README.md (gaps row N16).
#
# dm(android-only): the manifest written again for the copy: dm's name for it, its
# Android dependencies alone, no feature flags, no profiles (dm's are in
# desktop/Cargo.toml).
# dm(port-0312): gpui-pre and gpui-pre-wgpu at dm's pin, 0.3.12 (upstream
# pinned 0.3.6).
[package]
name = "gpui-android"
version = "0.1.0"
edition = "2021"
authors = ["Balamurali Pandranki <balamurali@live.com>"]
license = "GPL-3.0-or-later OR AGPL-3.0-or-later OR Apache-2.0"
description = "GPUI's Android platform (wgpu over Vulkan or GLES, android-activity's NativeActivity), from gpui-mobile"
repository = "https://github.com/itsbalamurali/gpui-mobile"
publish = false

[lib]
name = "gpui_android"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
raw-window-handle = "0.6"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
libc = "0.2"
# Keep `ndk` on the baseline `nativewindow` feature set. Enabling
# `api-level-31` links API 31 symbols directly, so the shared library
# fails to `dlopen` on older Android versions before our own code runs.
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
# Android uses Cosmic Text and system fonts; font-kit pulls in desktop Fontconfig.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
rustc-hash = "2"
uuid = { version = "1", features = ["v5"] }
