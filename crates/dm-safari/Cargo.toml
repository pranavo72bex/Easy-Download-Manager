[package]
name = "dm-safari"
version = "0.10.2"
license = "GPL-3.0-or-later"
edition = "2021"
# Never published: its paths to the other crates are this repository's
# (deny.toml).
publish = false
description = "dm's Safari extension's program: hands each message of the extension to dm's own native host"

# The program inside `dm Safari Extension.appex` (scripts/safari-extension.sh puts it in
# dm.app/Contents/PlugIns). Safari sends an extension's native messages to that program, not
# to a native messaging host, so it starts dm's own host (`dm --native-host`) for each and
# gives Safari its answer. Nothing of dm's is linked into it: it stays small, and what the
# host says is the host's alone (docs/decisions.md, 2026-11-18).
[[bin]]
name = "dm-safari"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
# Foundation's objects, reached by name through the Objective-C runtime: the handler class
# Safari's extension point asks for, and the messages it hands it (bridge.rs).
objc2.workspace = true
# The person's own home folder, which the extension's sandbox hides behind its own (relay.rs).
libc.workspace = true

[lints]
workspace = true
