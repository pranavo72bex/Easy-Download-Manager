org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Rust build (app/build.gradle.kts). Each may be given on the command line instead:
# ./gradlew assembleDebug -Pdm.rustProfile=debug
# cargo, where it is not on the PATH Gradle sees (Android Studio's often lacks ~/.cargo/bin).
dm.cargo=cargo
# release, debug, or a profile of desktop/Cargo.toml.
dm.rustProfile=release
# The ABIs libdm_android.so is built for; the first is the one the bindings are read from.
dm.abis=arm64-v8a,armeabi-v7a,x86_64
# true leaves the Rust build out (the library and bindings already made).
dm.skipRust=false
