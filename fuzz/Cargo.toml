# Coverage-guided fuzzing of every reader of outside input (gaps row H11): `cargo fuzz run
# <target>` on nightly, from this folder, as `.github/workflows/fuzz.yml` runs each nightly.
# Not a member of the workspace and never shipped: libFuzzer is a test's tool, as cargo-audit
# is (docs/decisions.md, 2026-11-24).
[package]
name = "edm-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# libFuzzer itself (C++) linked by default, as `cargo fuzz` builds it; `cargo check
# --no-default-features` checks the targets where no C++ compiler is at hand.
[features]
default = ["libfuzzer-sys/link_libfuzzer"]

[dependencies]
libfuzzer-sys = { version = "=0.4.10", default-features = false }
edm-core = { path = "../crates/edm-core" }
edm-torrent = { path = "../crates/edm-torrent" }
edm-media = { path = "../crates/edm-media" }
edm-js = { path = "../crates/edm-js" }
tempfile = "3"

[workspace]

# The crates EDM builds with changes of its own (vendor/README.md), as the root workspace takes
# them: without these the targets fuzzed crates.io's librqbit-bencode, whose unchecked number
# reader overflows, not the checked one EDM ships (issue #72). The fuzz targets build no window,
# so the GPUI copies are not named.
[patch.crates-io]
librqbit = { path = "../vendor/librqbit" }
librqbit-sha1-wrapper = { path = "../vendor/librqbit-sha1-wrapper" }
librqbit-bencode = { path = "../vendor/librqbit-bencode" }

[profile.release]
debug = 1

[[bin]]
name = "torrent_metainfo"
path = "fuzz_targets/torrent_metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hls_playlist"
path = "fuzz_targets/hls_playlist.rs"
test = false
doc = false
bench = false

